# ローカルと E2E のための compose。Forgejo、バックエンド（serve）、worker の 3 つを、1 つのタスクに見立てて動かす。
# 手順は README の「compose で動かす」、形の理由は design/deploy.md に書く。
#
# バックエンドと worker は、Forgejo のネットワークを共有する（network_mode: service:forgejo）。
# Forgejo の URL が、手元のマシンからもコンテナからも http://localhost:3000 になり、
# バックエンドがクライアントに返す git の URL を、手元のマシンでそのまま使えるようにするためである。
# worker は、どのポートでも待ち受けない。死活は、ハートビートのファイルを logiforge worker-health で見る。
name: logiforge

x-logiforge-common: &common
  LOGIFORGE_STORE_DIR: /var/lib/logiforge/store
  LOGIFORGE_FORGEJO_URL: http://localhost:3000
  LOGIFORGE_FORGEJO_ORG: logiforge
  # 読むだけのユーザー。worker は見回りで、バックエンドは apply request の作成で、git を読む。
  LOGIFORGE_WORKER_LOGIN: logiforge-reader
  LOGIFORGE_WORKER_TOKEN_FILE: /run/secrets/worker_token
  # ローカルの Forgejo は http で動く。本番では https だけにする（既定）。
  LOGIFORGE_GIT_ALLOW_PROTOCOL: http:https:file

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    ports:
      # バックエンドの API も、このサービスのネットワークで待ち受ける。
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
    volumes:
      - forgejo:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      retries: 30

  worker:
    build:
      context: .
      # logiforge version に出す版とコミット。渡さなければ dev（例：LOGIFORGE_VERSION=$(git describe --tags --always --dirty) LOGIFORGE_COMMIT=$(git rev-parse HEAD) docker compose build）
      args:
        VERSION: ${LOGIFORGE_VERSION:-dev}
        COMMIT: ${LOGIFORGE_COMMIT:-}
    image: logiforge:local
    command: ["worker"]
    network_mode: service:forgejo
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      <<: *common
      LOGIFORGE_WORKER_DIR: /var/lib/logiforge/worker
      # 記録の署名の公開鍵。反映かの判定で、記録を確かめる（design/backend/verify.md）。scripts/compose-setup.sh が作る。
      LOGIFORGE_RECORD_PUBLIC_KEYS_FILE: /run/secrets/record_public_keys
    secrets: [worker_token, record_public_keys]
    volumes:
      - worker:/var/lib/logiforge/worker
      - store:/var/lib/logiforge/store
    healthcheck:
      test: ["CMD", "logiforge", "worker-health"]
      interval: 5s
      retries: 30

  backend:
    # worker と同じイメージである。コマンドだけを変える。
    build:
      context: .
      # logiforge version に出す版とコミット。渡さなければ dev（例：LOGIFORGE_VERSION=$(git describe --tags --always --dirty) LOGIFORGE_COMMIT=$(git rev-parse HEAD) docker compose build）
      args:
        VERSION: ${LOGIFORGE_VERSION:-dev}
        COMMIT: ${LOGIFORGE_COMMIT:-}
    image: logiforge:local
    command: ["serve"]
    network_mode: service:forgejo
    depends_on:
      worker:
        condition: service_healthy
    environment:
      <<: *common
      LOGIFORGE_ADDR: 0.0.0.0:8080
      LOGIFORGE_USER_TEAM: logiforge-users
      LOGIFORGE_RECORD_KEYS_FILE: /run/secrets/record_keys
      # WebUI のサインイン（Forgejo の OAuth2）。アプリケーションは scripts/compose-setup.sh が登録する。
      LOGIFORGE_OAUTH_CLIENT_ID_FILE: /run/secrets/oauth_client_id
      LOGIFORGE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/oauth_client_secret
      LOGIFORGE_OAUTH_REDIRECT_URI: http://localhost:8080/oauth/callback
    secrets: [record_keys, worker_token, oauth_client_id, oauth_client_secret]
    volumes:
      # バックエンドは、置き場を読むだけである。
      - store:/var/lib/logiforge/store:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      retries: 30

volumes:
  forgejo:
  # clone を置く。正本ではないが、失うと作り直しに時間がかかる。
  worker:
  # 置き場（手元のディレクトリ）。branches/ は git から作り直せないので、バックアップを取る。
  store:

# scripts/compose-setup.sh が作る。
secrets:
  worker_token:
    file: .compose/secrets/worker_token
  record_keys:
    file: .compose/secrets/record_keys
  # 公開鍵は秘密ではないが、ほかと同じくファイルで渡す。
  record_public_keys:
    file: .compose/secrets/record_public_keys
  oauth_client_id:
    file: .compose/secrets/oauth_client_id
  oauth_client_secret:
    file: .compose/secrets/oauth_client_secret
