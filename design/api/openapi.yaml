openapi: 3.1.0
info:
  title: Logiforge API
  version: 0.1.0
  description: |
    Logiforge のバックエンドの API。
    全体に共通する決まり（主体と認証、コミット、エラー）は design/api/README.md に、ページングは design/api/paging.md に書く。
    要件は docs/ が正本である。
    主文・タイトル・概要の文字数の上限と数え方は、../../docs/tree/README.md に従う。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /v1
    description: Logiforge を置いたホストからの相対パス
security:
  - bearerAuth: []
tags:
  - name: repository
    description: repository の作成と参照
  - name: tree
    description: 木の参照
  - name: apply-request
    description: apply request と論理レビュー
  - name: work
    description: 着手できる作業と、作業の終わりの判定
  - name: evidence
    description: artifact、検証結果、レポート
  - name: human-request
    description: 人への依頼（PVR と判断の依頼）
  - name: history
    description: 履歴とエクスポート
  - name: oauth
    description: WebUI のサインイン（GitHub App か Forgejo の OAuth2 の中継）
  - name: setup
    description: 初回のセットアップ（始めたブラウザのトークンだけが続けられる。最後の段でサインインした人が、最初の利用者になる）
  - name: settings
    description: 設定（user だけ）

paths:
  /oauth/config:
    get:
      tags: [oauth]
      operationId: getOAuthConfig
      summary: WebUI のサインインに使う OAuth2 の設定
      description: |
        認証を求めない。設計は ../../design/webui/auth.md と ../../design/webui/oauth-relay.md に従う。
        GitHub を使う構成では Logiforge の GitHub App の、Forgejo を使う構成では Forgejo の OAuth2 のアプリケーションの値を、設定の DB から読んで返す。
        authorize_url は、GitHub では GitHub の画面の URL の /login/oauth/authorize、Forgejo ではブラウザから Forgejo への URL の /login/oauth/authorize である。
        構成と client_id がまだ設定の DB になければ setup_required。
      security: []
      responses:
        '200':
          description: authorize の URL など
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, client_id, redirect_uri, scope, gitforge]
                properties:
                  authorize_url: { type: string, format: uri }
                  gitforge: { type: string, enum: [forgejo, github], description: 'サインインする GitForge。画面の文言に使う' }
                  client_id: { type: string }
                  redirect_uri: { type: string, format: uri }
                  scope: { type: string, description: 'スペースで区切ったスコープ。GitHub では offline_access だけ。値は design/webui/auth.md の「スコープ」に書く' }
        '4XX': { $ref: '#/components/responses/Problem' }
        '5XX': { $ref: '#/components/responses/Problem' }
  /oauth/token:
    post:
      tags: [oauth]
      operationId: exchangeOAuthCode
      summary: 認可コードをアクセストークンに交換する（BE が client secret を足して GitForge に中継する）
      description: |
        認証を求めない。決まりは ../../design/webui/oauth-relay.md に従う。GitForge が拒んだら unauthenticated。
        リフレッシュトークンがあれば、BE がセッションに置き、セッションの cookie（__Host-lf_session、HttpOnly、Secure、SameSite=Strict）を付ける（../../design/webui/session.md）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                code: { type: string }
                code_verifier: { type: string }
      responses:
        '200':
          description: GitForge の応答から、リフレッシュトークンを除いたもの
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthToken' }
        '4XX': { $ref: '#/components/responses/Problem' }
        '5XX': { $ref: '#/components/responses/Problem' }
  /oauth/session:
    post:
      tags: [oauth]
      operationId: getOAuthSession
      summary: セッションの cookie から、アクセストークンをもらう（期限が近ければ、BE が GitForge で refresh する）
      description: |
        cookie（__Host-lf_session）で認可する。Content-Type: application/json と、WebUI のオリジンの Origin を求める（違えば forbidden）。
        セッションがない、切れた、GitForge が refresh を断ったときは、セッションと cookie を消して unauthenticated。決まりは ../../design/webui/session.md に従う。
      security: []
      responses:
        '200':
          description: アクセストークンと、その残りの寿命
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthToken' }
        '4XX': { $ref: '#/components/responses/Problem' }
        '5XX': { $ref: '#/components/responses/Problem' }
  /oauth/signout:
    post:
      tags: [oauth]
      operationId: signOutOAuthSession
      summary: セッションを消し、cookie を消す
      description: "Content-Type が application/json で、Origin が WebUI のオリジンであることを求める。GitForge での取り消しはしない（../../design/webui/session.md）。"
      security: []
      responses:
        '204':
          description: 消した（セッションがなくても 204）
        '4XX': { $ref: '#/components/responses/Problem' }
        '5XX': { $ref: '#/components/responses/Problem' }

  /setup:
    get:
      tags: [setup]
      operationId: getSetup
      summary: セットアップが終わったか、どの段まで進んだか、選んだ構成
      description: |
        認証を求めない。WebUI が、セットアップの画面を出すかを決めるのに使う。
        セットアップが終わったあとも、done が true の応答を返す。決まりは ../../design/api/endpoints/setup.md に従う。
      security: []
      responses:
        '200':
          description: セットアップの状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /setup/gitforge:
    put:
      tags: [setup]
      operationId: setSetupGitForge
      summary: 構成（github か forgejo）を決める
      description: |
        セットアップを始める呼び出しである。Logiforge-Setup-Token を付けずに呼び、まだ始まっていなければ、始めて、応答の setup_token にトークンを入れる。
        ブラウザは、トークンを localStorage に置き、以後のセットアップの要求に付ける（../../design/settings/setup.md の「だれがセットアップできるか」）。
        もう始まっていて、トークンがないか違えば setup_in_progress。セットアップが終わっていれば setup_done。
      security:
        - {}
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gitforge]
              properties:
                gitforge: { $ref: '#/components/schemas/GitForgeKind' }
                webui_url: { type: string, format: uri, description: WebUI の URL（ブラウザの今のオリジン）。サインインの redirect_uri の元になる。GitHub の構成では、createSetupGitHubManifest でも置く }
      responses:
        '200':
          description: セットアップの状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /setup/github/manifest:
    post:
      tags: [setup]
      operationId: createSetupGitHubManifest
      summary: GitHub App の manifest と、manifest を送る先の URL を返す
      description: |
        manifest の中身は ../../design/settings/setup.md の「GitHub を使う構成：App を manifest flow で作る」に従う。
        受け取った WebUI の URL は、設定の DB に置く。構成が github でなければ validation_failed。
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, owner_kind, webui_url, public]
              properties:
                owner: { type: string, description: App を作る organization かアカウントの名前 }
                owner_kind: { type: string, enum: [organization, user] }
                webui_url: { type: string, format: uri, description: WebUI の URL。redirect_uri と manifest の URL の元になる }
                public: { type: boolean, description: ほかの owner にも install するなら true }
      responses:
        '200':
          description: manifest と送り先
          content:
            application/json:
              schema:
                type: object
                required: [manifest, post_url]
                properties:
                  manifest: { type: object, description: GitHub に送る manifest（JSON） }
                  post_url: { type: string, format: uri, description: manifest をフォームで送る GitHub の URL }
        '4XX': { $ref: '#/components/responses/Problem' }
  /setup/github/conversion:
    post:
      tags: [setup]
      operationId: convertSetupGitHubManifest
      summary: manifest flow の code を GitHub App に換え、設定の DB に置く
      description: |
        BE が POST /app-manifests/{code}/conversions を呼び、App の ID、slug、client_id、client secret、秘密鍵を置く（../../design/settings/setup.md）。
        code が切れているか正しくなければ validation_failed。そのときは createSetupGitHubManifest からやり直す。
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: 作った App
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupGitHubApp' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /setup/repository:
    put:
      tags: [setup]
      operationId: setSetupRepository
      summary: GitHub の構成で、最初の repository を登録する
      description: |
        登録の決まりは registerRepository と同じである。GitHub App の installation token で、その GitHub リポジトリを読めなければ validation_failed。
        Forgejo の構成では validation_failed。セットアップが終わっていれば setup_done。決まりは ../../design/settings/setup.md の「流れ」に従う。
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisteredRepository' }
      responses:
        '200':
          description: セットアップの状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /setup/forgejo:
    put:
      tags: [setup]
      operationId: setSetupForgejo
      summary: Forgejo の URL、organization、OAuth2 のアプリケーション、worker のユーザーとトークンを確かめてから置く
      description: |
        置く前に、worker のトークンで、そのユーザーと organization を読めることを確かめる。読めなければ validation_failed（../../design/settings/setup.md の「Forgejo を使う構成」）。
        構成が forgejo でなければ validation_failed。
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgejoSettingsInput' }
      responses:
        '200':
          description: セットアップの状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /setup/finish:
    post:
      tags: [setup]
      operationId: finishSetup
      summary: サインインした主体を、最初の利用者（user）にし、セットアップを終える
      description: |
        WebUI のサインインで得たトークンを求める。
        トークンが、Logiforge の GitHub App か Forgejo の OAuth2 のアプリケーションのものでなければ unauthenticated。
      security:
        - bearerAuth: []
          setupToken: []
      responses:
        '200':
          description: セットアップの状態（done は true）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: 設定（user だけ。秘密は、置いたかどうかだけ）
      description: |
        user でなければ forbidden。user の決め方は design/settings/users.md の「利用者の決め方」に従う。
        WebUI は、forbidden かどうかで、設定のメニューを出すかを決める。
      responses:
        '200':
          description: 設定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /settings/gitforge:
    patch:
      tags: [settings]
      operationId: updateGitForgeSettings
      summary: GitForge とのつなぎ方と、見回りの間隔を変える（user だけ）
      description: |
        送った項目だけを変える。秘密は、送ったものだけを置き換える。構成（github か forgejo）は変えられない。
        GitHub を使う構成で、git の操作の時間の上限が 20 分以上なら validation_failed（../../design/adapters/github-app.md の「installation token」）。
        Forgejo を使う構成で worker のトークンを置き換えるときは、そのトークンで worker のユーザーと organization を読めることを確かめる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webui_url: { type: string, format: uri }
                github: { $ref: '#/components/schemas/GitHubSettingsInput' }
                forgejo: { $ref: '#/components/schemas/ForgejoSettingsInput' }
                intervals: { $ref: '#/components/schemas/IntervalSettings' }
      responses:
        '200':
          description: 変えたあとの設定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /settings/repositories:
    get:
      tags: [settings]
      operationId: listRegisteredRepositories
      summary: 登録した repository の一覧（user だけ。すべてを返す）
      responses:
        '200':
          description: 登録した repository
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RegisteredRepository' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /settings/repositories/{repository}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    put:
      tags: [settings]
      operationId: registerRepository
      summary: repository を登録する（user だけ）。登録済みか、外した名前の gitforge_ref とディレクトリは変えられない（validation_failed）
      description: |
        GitHub を使う構成では、GitHub App の installation token で、その GitHub リポジトリを読めることを確かめる。
        読めなければ validation_failed で、detail に install の URL を書く（../../design/api/endpoints/settings.md）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gitforge_ref]
              properties:
                gitforge_ref: { type: string, description: 'GitHub では owner/name' }
                directory: { type: string, description: ディレクトリの repository の、git リポジトリの中のパス。git リポジトリ全体なら渡さない }
      responses:
        '200':
          description: 登録した repository
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredRepository' }
        '4XX': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [settings]
      operationId: unregisterRepository
      summary: repository を外す（user だけ）。置き場のスナップショットと keep/ は消さない
      responses:
        '204':
          description: 外した
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories:
    get:
      tags: [repository]
      operationId: listRepositories
      summary: repository の一覧
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: repository の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Repository' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [repository]
      operationId: createRepository
      summary: repository を作る（user だけ。根の仮説の主文を一緒に受け取る）
      description: |
        repository の用意の手順は ../../design/backend/README.md に従う。
        GitForge 側の参照は、GitForge アダプタから求める（../../design/adapters/README.md）。
        送り直しは、repository の用意の判定で見分ける。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/RepositoryNameValue' }
                statement:
                  $ref: '#/components/schemas/Statement'
                  description: 根の仮説の主文。migrate_from がなければ必須で、あれば渡さない
                migrate_from:
                  type: string
                  description: 別リポジトリ方式から移すときの、元の repository の名前（../../design/directory/migrate.md）。移した先は、ディレクトリの repository である
                background: { type: string }
      responses:
        '201':
          description: 作った repository
          headers:
            Logiforge-Pending-Commit: { $ref: '#/components/headers/PendingCommit' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [repository]
      operationId: getRepository
      summary: repository
      responses:
        '200':
          description: repository
          headers:
            Logiforge-Latest-Invalid: { $ref: '#/components/headers/LatestInvalid' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/tree:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [tree]
      operationId: getTree
      summary: 木の概要
      parameters:
        - $ref: '#/components/parameters/Commit'
        - $ref: '#/components/parameters/ApplyRequestView'
      responses:
        '200':
          description: 木の概要。根がまだなければ 404
          headers:
            Logiforge-Latest-Invalid: { $ref: '#/components/headers/LatestInvalid' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tree' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /repositories/{repository}/tree/nodes:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [tree]
      operationId: listNodes
      summary: 木または部分木のノード
      description: |
        `root` を指定すると、そのノードを根とする部分木だけを返す。
        `commit` を指定すると、その main のコミットの木を返す。
        `apply_request` を指定すると、その apply request を反映したあとのスナップショットツリーを返す。
      parameters:
        - $ref: '#/components/parameters/Commit'
        - $ref: '#/components/parameters/ApplyRequestView'
        - name: root
          in: query
          description: 部分木の根にするノード。apply_request を指定したとき、その apply request を反映すると消えるノードは not_found（404）になる
          schema: { $ref: '#/components/schemas/NodeId' }
        - name: depth
          in: query
          description: 部分木の根から何段までを返すか。指定しなければすべて
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: ノードの一覧
          headers:
            Logiforge-Latest-Invalid: { $ref: '#/components/headers/LatestInvalid' }
          content:
            application/json:
              schema:
                type: object
                required: [commit, nodes]
                properties:
                  commit: { $ref: '#/components/schemas/Commit' }
                  valid_commit: { type: [string, 'null'], description: Repository の valid_commit と同じ（../../design/backend/invalid-main.md） }
                  invalid_since: { type: [string, 'null'], description: Repository の invalid_since と同じ }
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/Node' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/tree/completion:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [work]
      operationId: getCompletion
      summary: 作業の終わりの判定
      responses:
        '200':
          description: 判定の結果
          headers:
            Logiforge-Latest-Invalid: { $ref: '#/components/headers/LatestInvalid' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Completion' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/tree/export:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [history]
      operationId: exportTree
      summary: 木を JSON か Markdown で書き出す
      description: 形は ../../design/api/export.md に従う。
      parameters:
        - $ref: '#/components/parameters/Commit'
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [json, markdown] }
      responses:
        '200':
          description: 書き出した木
          content:
            application/json:
              schema: { type: object }
            text/markdown:
              schema: { type: string }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/commits:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [history]
      operationId: listCommits
      summary: main のコミットの一覧（新しい順）
      description: |
        worker が取り込んだ main のコミットを、新しい順に返す（../../design/backend/snapshot/main.md）。
        カーソルは、次に読むコミットの number である。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: main のコミットの一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MainCommit' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [tree]
      operationId: getNode
      summary: ノードの詳細
      description: apply_request を指定したとき、その apply request を反映すると消えるノードは not_found（404）になる。
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
        - $ref: '#/components/parameters/Commit'
        - $ref: '#/components/parameters/ApplyRequestView'
      responses:
        '200':
          description: ノードの詳細
          headers:
            Logiforge-Latest-Invalid: { $ref: '#/components/headers/LatestInvalid' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/nodes/{nodeId}/history:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [history]
      operationId: getNodeHistory
      summary: ノードの履歴
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: そのノードのパスを変えた、main のコミットの一覧（新しい順）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeHistoryPage' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [apply-request]
      operationId: listApplyRequests
      summary: apply request の一覧
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ApplyRequestState' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: apply request の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApplyRequest' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [apply-request]
      operationId: createApplyRequest
      summary: apply request を作る（client だけ）
      description: |
        push したブランチから main への pull request を作る。ブランチの先頭のコミットが、最初の先頭のコミットになる。手順は ../../design/backend/apply-request/README.md に従う。
        差分が 4 種類の操作として読めなければ、validation_failed で受け付けない。操作は、差分から復元して応答に入れる。
        そのブランチに open の apply request がすでにあれば、validation_failed で受け付けない。
        バックエンドが、作業用の git の複製からブランチを読んで検査する。worker を待たない（../../design/backend/apply-request/create.md の「作成」）。
        先頭のコミットのスナップショットは、worker がブランチを取り込んでから読む側に出る。それまで、そのコミットへのレビューは snapshot_pending になる。
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              properties:
                branch: { $ref: '#/components/schemas/BranchName' }
                commit:
                  $ref: '#/components/schemas/Commit'
                  description: 取り込むコミット。ブランチの今の先頭と違えば、validation_failed で受け付けない。指定しなければ、ブランチの今の先頭
                description:
                  type: string
                  description: 説明欄。レビューの材料には含めない
      responses:
        '201':
          description: 作った apply request
          headers:
            Logiforge-Pending-Commit: { $ref: '#/components/headers/PendingCommit' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [apply-request]
      operationId: getApplyRequest
      summary: apply request の詳細（差分、レビュー、反映の失敗）
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      responses:
        '200':
          description: apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [apply-request]
      operationId: updateApplyRequest
      summary: apply request の説明欄を書き換える（client だけ）
      description: |
        新しいコミットは、利用者がブランチに push するだけで、この API は使わない（../../design/backend/apply-request/README.md）。
        この API は、説明欄だけを書き換える。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
      responses:
        '200':
          description: 更新した apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}/reviews:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    post:
      tags: [apply-request]
      operationId: reviewApplyRequest
      summary: レビューを付ける（client と、その repository に Write がある user。pull request の作者とは別のアカウント）
      description: |
        user（WebUI）は、WebUI のサインインで得たトークンで呼ぶ。その repository に Write がなければ forbidden（../../design/settings/users.md の「WebUI からのレビュー」）。
        `approve` は、向き先が main なら、先に今の main で確かめる（../../design/backend/merge.md の「approve」）。通ったときだけ GitForge に approve を出す。merge はしない（mergeApplyRequest）。
        確かめに通らなければ、approve を出さず、理由を code にして返す（stale_target、conflict、invariant_violation、snapshot_pending）。stale_target、conflict、invariant_violation では、理由を pull request のふつうのコメントにも書く（apply request の `comments` で読める）。
        先頭のコミットが GitForge にはあるが、worker がまだスナップショットにしていなければ、どの種類のレビュー（approve、request_changes、comment）も付けられず、snapshot_pending を返す。少し待って送り直す。
        呼んだ主体が pull request の作者なら、GitForge が approve を拒む（../../design/adapters/pull-requests.md の「数える review」）。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, commit]
              properties:
                kind: { $ref: '#/components/schemas/ReviewKind' }
                commit:
                  $ref: '#/components/schemas/Commit'
                  description: レビューした先頭のコミットの SHA（../../design/backend/apply-request/README.md）。ブランチの今の先頭のコミットと違えば commit_conflict で受け付けない
                body:
                  type: string
                  description: review の本文。comment と request_changes では必須（GitForge が本文のない review を拒む）。空なら validation_failed で受け付けない。approve ではなくてよい
                prompt_revision:
                  type: string
                  description: 使ったプロンプトのリビジョン。client の approve では必須。user（WebUI）では送らない。review の本文の最後に、人が読む文で書く。読むときは返さない
      responses:
        '201':
          description: 付けたレビューと、その後の apply request
          content:
            application/json:
              schema:
                type: object
                required: [review, apply_request]
                properties:
                  review: { $ref: '#/components/schemas/Review' }
                  apply_request: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}/merge:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    post:
      tags: [apply-request]
      operationId: mergeApplyRequest
      summary: approve された apply request を、呼んだ主体のトークンで squash merge する（client と、その repository に Write がある user）
      description: |
        merge の直前に、承認されているかと、木が壊れないかを、今の main で確かめ直す（../../design/backend/merge.md の「merge」）。
        - 承認の状態（review_decision）が approved でなければ、not_approved。GitForge の承認を必須にする設定が、承認が足りないとして merge を断ったときも、not_approved。
        - 確かめに通らなければ、理由を code にして返す（stale_target、conflict、invariant_violation、snapshot_pending）。stale_target、conflict、invariant_violation では、理由を pull request のふつうのコメントにも書く。
        - 呼んだ主体に merge の権限がなく、GitForge が断ったら、merge_forbidden。
        - 向き先が main でなければ、validation_failed。Logiforge では merge しない。GitForge で merge する。
        opener も呼べる。もう反映された apply request に送り直したら、成功として今の状態を返す。
        GitForge の画面から直接 merge してもよい。Logiforge は、そのコミットも受け入れる（../../design/backend/invalid-main.md の「main はいつも正しい」）。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: merge したあとの apply request
          headers:
            Logiforge-Pending-Commit: { $ref: '#/components/headers/PendingCommit' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}/close:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    post:
      tags: [apply-request]
      operationId: closeApplyRequest
      summary: apply request を close する（却下または取り下げ）
      description: |
        理由は、pull request のコメントに、人が読む文で書く（../../design/adapters/texts.md の「close のコメント」）。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: close した apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}/fixed:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    post:
      tags: [apply-request]
      operationId: markApplyRequestFixed
      summary: 修正待ちの apply request を、直し終えたと申告する（opener だけ）
      description: |
        pull request のラベルを、修正待ちからレビュー待ちに付け替える。push はしない。
        呼べるのは pull request の作者だけで、違えば forbidden。open でなければ not_open。
        すでにレビュー待ちなら、何もせずに成功とする。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      responses:
        '200':
          description: 付け替えたあとの apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}/review-material:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [apply-request]
      operationId: getReviewMaterial
      summary: レビューの材料
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      responses:
        '200':
          description: 先頭のコミットの差分に対するレビューの材料。説明欄は含めない。apply request の向き先が main でなければ overlay_unsupported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewMaterial' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/work:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [work]
      operationId: listWork
      summary: 着手できる作業
      parameters:
        - name: subtree
          in: query
          description: この部分木の中の作業だけを返す
          schema: { $ref: '#/components/schemas/NodeId' }
        - name: kind
          in: query
          description: 返す作業の種類。指定しなければすべて
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkKind' }
          style: form
          explode: false
        - name: include_claimed
          in: query
          description: 真なら、open の apply request が対象にしているノードの作業も返す
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 着手できる作業
          headers:
            Logiforge-Latest-Invalid: { $ref: '#/components/headers/LatestInvalid' }
          content:
            application/json:
              schema:
                type: object
                required: [commit, counts, items, next_cursor]
                properties:
                  commit: { $ref: '#/components/schemas/Commit' }
                  valid_commit: { type: [string, 'null'], description: Repository の valid_commit と同じ（../../design/backend/invalid-main.md） }
                  invalid_since: { type: [string, 'null'], description: Repository の invalid_since と同じ }
                  counts:
                    type: object
                    description: 種類ごとの件数（ページに関わらず全体）
                    additionalProperties: { type: integer }
                  items:
                    type: array
                    description: 作業の種類の順、次にノードの識別子の順、次に subject_id の順。カーソルは commit に結びつける（../../design/api/paging.md）
                    items: { $ref: '#/components/schemas/WorkItem' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/artifacts/{sha256}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [evidence]
      operationId: getArtifact
      summary: artifact のファイルを読む
      description: 指定したコミット（main のコミットのほか、apply request の先頭のコミットも指定できる）の artifacts/ から、file の artifact の中身を読む
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Sha256' }
        - $ref: '#/components/parameters/Commit'
      responses:
        '200':
          description: 中身
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/verdicts/{verdictId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [evidence]
      operationId: getVerdict
      summary: 検証結果とレポート
      parameters:
        - name: verdictId
          in: path
          required: true
          schema: { type: string, pattern: '^v-' }
      responses:
        '200':
          description: 検証結果
          headers:
            Logiforge-Latest-Invalid: { $ref: '#/components/headers/LatestInvalid' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verdict' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/human-requests:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [human-request]
      operationId: listHumanRequests
      summary: 人への依頼の一覧
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/HumanRequestKind' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/HumanRequestState' }
        - name: node_id
          in: query
          schema: { $ref: '#/components/schemas/NodeId' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 人への依頼の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HumanRequest' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [human-request]
      operationId: createHumanRequest
      summary: 人への依頼を起票する（client だけ）
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, kind, body]
              properties:
                node_id: { $ref: '#/components/schemas/NodeId' }
                kind: { $ref: '#/components/schemas/HumanRequestKind' }
                body:
                  type: string
                  minLength: 1
                  description: 検証手順、または問い
      responses:
        '201':
          description: 起票した人への依頼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/human-requests/{humanRequestId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [human-request]
      operationId: getHumanRequest
      summary: 人への依頼と、その回答
      parameters:
        - $ref: '#/components/parameters/HumanRequestId'
      responses:
        '200':
          description: 人への依頼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/human-requests/{humanRequestId}/attachments/{sha256}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [human-request]
      operationId: getAnswerAttachment
      summary: 回答の添付のファイルを読む
      parameters:
        - $ref: '#/components/parameters/HumanRequestId'
        - name: sha256
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Sha256' }
      responses:
        '200':
          description: 中身
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/human-requests/{humanRequestId}/answer:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    post:
      tags: [human-request]
      operationId: answerHumanRequest
      summary: 人への依頼に回答する（user だけ。1 回だけ）
      description: |
        送り直しは、回答がすでにあり、本文と回答した利用者が同じなら、成功とする。
        回答と添付は、git ではなく、GitForge の側に置く（../../design/files/artifacts.md）。
        GitForge がコメントにファイルを添付できない構成では、添付は link だけで、file は validation_failed で受け付けない。
      parameters:
        - $ref: '#/components/parameters/HumanRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
                attachments:
                  type: array
                  items: { $ref: '#/components/schemas/ArtifactInput' }
      responses:
        '201':
          description: 回答した人への依頼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 主体（user または client）を示すトークン
    setupToken:
      type: apiKey
      in: header
      name: Logiforge-Setup-Token
      description: セットアップを始めたブラウザのトークン。setSetupGitForge の応答の setup_token で受け取る。違えば setup_in_progress（../../design/settings/setup.md の「だれがセットアップできるか」）

  parameters:
    RepositoryName:
      name: repository
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RepositoryNameValue' }
    NodeIdPath:
      name: nodeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NodeId' }
    ApplyRequestId:
      name: applyRequestId
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    HumanRequestId:
      name: humanRequestId
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    Commit:
      name: commit
      in: query
      description: >-
        読むコミットの SHA。main のコミットか、worker がブランチのスナップショットを作ったブランチのコミットである。指定しなければ、今の main のコミット（latest）。
        ブランチのコミットのスナップショットツリーは、その base の main のスナップショットツリーにブランチの差分を重ねて、読むたびに作る（../../design/backend/snapshot/branch.md の「ブランチのコミットのスナップショットツリー」）。
        worker が、まだそのコミットを取り込んでいなければ、snapshot_pending になる。少し待って送り直す。
      schema: { $ref: '#/components/schemas/Commit' }
    ApplyRequestView:
      name: apply_request
      in: query
      description: >-
        open の apply request の識別子。指定すると、その先頭のコミットの差分を、向き先の今の先頭のスナップショットツリーに重ねた、
        反映したあとのスナップショットツリーを返す（../../design/backend/snapshot/branch.md の「向き先に重ねる」）。応答の commit は、重ねた向き先のコミットである。
        向き先が main なら、今の先頭は latest である。向き先が main でなければ、向き先のブランチの履歴の最後のコミットである。このとき、Logiforge は検査しないので、値は決まりに沿っているかを確かめていない。
        commit と同時には指定できない（validation_failed）。
        向き先が main で、重ねられなければ overlay_conflict を返す。向き先が main でなければ、衝突は判定しない（差分が変えたパスは先頭のファイル、ほかは向き先のファイルを使う）。先頭のコミットか、向き先の今の先頭のスナップショットがまだなければ snapshot_pending、open でなければ not_open を返す。
        向き先のブランチが消えていれば、not_found を返す。
        その識別子の apply request がこの repository になければ（ほかの repository のものを含む）、not_found を返す。
        getNode の nodeId と listNodes の root に、その apply request を反映すると消えるノードを指定したときも、not_found を返す。反映したあとのスナップショットツリーに、そのノードがないからである。
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  headers:
    LatestInvalid:
      description: |
        最新の main のコミットが valid でないときに、木を読む応答（getRepository、木、ノード、検証結果、作業、作業の終わり）に付ける。
        値は、応答の木のコミット（valid_commit。なければ最新のコミット）である。
        apply request と人への依頼を読む応答には付けない（../../design/backend/invalid-main.md の「木を読む API」）
      schema: { type: string }
    PendingCommit:
      description: |
        書いたものが、待つ時間の上限までに読む側に出なかったときに付ける。値は、読む側に出るのを待っているコミット。
        決まりは ../../design/api/writes.md の「書いた直後の読み」に従う
      schema: { type: string }

  responses:
    Problem:
      description: エラー
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    OAuthToken:
      type: object
      description: リフレッシュトークンは含めない（../../design/webui/auth.md の「トークンの持ち方」）
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer, description: アクセストークンの寿命（秒） }
    GitForgeKind:
      type: string
      enum: [github, forgejo]
    SetupState:
      type: object
      required: [done, started, step, gitforge]
      properties:
        done: { type: boolean, description: セットアップが終わったか }
        started: { type: boolean, description: だれかがセットアップを始めたか。トークンを持たないブラウザは、続けられない }
        setup_token: { type: string, description: セットアップを始めた setSetupGitForge の応答にだけ入る、セットアップのトークン }
        step:
          type: [string, 'null']
          enum: [gitforge, github_app, forgejo, signin, null]
          description: 次に進める段。github_app は App の作成、signin は（GitHub なら install と）サインイン。終わっていれば null
        gitforge:
          oneOf:
            - $ref: '#/components/schemas/GitForgeKind'
            - type: 'null'
          description: 選んだ構成。まだ選んでいなければ null
        github_app:
          oneOf:
            - $ref: '#/components/schemas/SetupGitHubApp'
            - type: 'null'
          description: GitHub を使う構成で、App を作ったあとなら、その App。続きから install の段を示すのに使う
    SetupGitHubApp:
      type: object
      required: [slug, install_url]
      properties:
        slug: { type: string }
        install_url: { type: string, format: uri, description: App を owner に install する GitHub の画面 }
    GitHubSettingsInput:
      type: object
      description: GitHub App とつなぐ設定。秘密は書くときだけ受け取る（../../design/settings/README.md）
      properties:
        app_id: { type: integer }
        client_id: { type: string }
        slug: { type: string }
        private_key: { type: string, writeOnly: true, description: PEM }
        client_secret: { type: string, writeOnly: true }
        api_url: { type: string, format: uri, description: GitHub の REST の URL }
        web_url: { type: string, format: uri, description: GitHub の画面の URL。サインインの authorize とトークンのエンドポイントの元 }
    ForgejoSettingsInput:
      type: object
      description: Forgejo とつなぐ設定。setSetupForgejo ではすべて必須で、updateGitForgeSettings では送った項目だけを変える
      properties:
        url: { type: string, format: uri, description: BE から Forgejo への URL }
        public_url: { type: string, format: uri, description: ブラウザから Forgejo への URL。渡さなければ url と同じ }
        organization: { type: string }
        client_id: { type: string, description: OAuth2 のアプリケーションの client_id }
        client_secret: { type: string, writeOnly: true }
        worker_user: { type: string }
        worker_token: { type: string, writeOnly: true, description: 'read:repository、read:organization、read:issue' }
    IntervalSettings:
      type: object
      description: 見回りの間隔、一覧を読み直す間隔、git の操作の時間の上限は ../../design/backend/worker/patrol.md に従い、worker が次に一覧を読み直したときから効く
      properties:
        patrol_seconds: { type: number, exclusiveMinimum: 0, description: 見回りの間隔 }
        list_seconds: { type: number, exclusiveMinimum: 0, description: repository の一覧を読み直す間隔 }
        git_timeout_seconds: { type: number, exclusiveMinimum: 0, description: git の操作の時間の上限 }
        write_wait_seconds: { type: number, exclusiveMinimum: 0, description: 書いたものが読む側に出るまで待つ上限。バックエンドが、次の要求から使う（../../design/api/writes.md） }
    Settings:
      type: object
      required: [gitforge, webui_url, intervals, updated_by, updated_at]
      properties:
        gitforge: { $ref: '#/components/schemas/GitForgeKind' }
        webui_url: { type: string, format: uri }
        github:
          type: [object, 'null']
          description: GitHub を使う構成のときだけ
          properties:
            app_id: { type: integer }
            client_id: { type: string }
            slug: { type: string }
            api_url: { type: string, format: uri }
            web_url: { type: string, format: uri }
            private_key: { $ref: '#/components/schemas/SecretState' }
            client_secret: { $ref: '#/components/schemas/SecretState' }
        forgejo:
          type: [object, 'null']
          description: Forgejo を使う構成のときだけ
          properties:
            url: { type: string, format: uri }
            public_url: { type: string, format: uri }
            organization: { type: string }
            client_id: { type: string }
            client_secret: { $ref: '#/components/schemas/SecretState' }
            worker_user: { type: string }
            worker_token: { $ref: '#/components/schemas/SecretState' }
        intervals: { $ref: '#/components/schemas/IntervalSettings' }
        updated_by: { type: string, description: 最後に設定を変えた利用者 }
        updated_at: { type: string, format: date-time }
    SecretState:
      type: object
      description: 秘密の値は返さない。置いてあるかと、最後に変えた利用者と時刻だけを返す（design/settings/secrets.md の「秘密を差し替える」）
      required: [set]
      properties:
        set: { type: boolean, description: 置いてあるか }
        updated_by: { type: [string, 'null'], description: 最後に変えた利用者 }
        updated_at: { type: [string, 'null'], format: date-time }
    RegisteredRepository:
      type: object
      required: [name, gitforge_ref]
      properties:
        name: { $ref: '#/components/schemas/RepositoryNameValue' }
        gitforge_ref: { type: string }
        directory: { type: string, description: ディレクトリの repository のパス。git リポジトリ全体なら空 }
        prepared:
          type: boolean
          description: |
            GitForge の git リポジトリに、木の最初のコミットがもうあるか。listRegisteredRepositories と registerRepository の応答にだけ入る。
            GitForge に聞けなかったときは入らない（../../design/api/endpoints/settings.md の「prepared」）。
    RepositoryNameValue:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      description: repository の名前。Logiforge の中で一意
    Repository:
      type: object
      required: [name, root_hypothesis_id, git_url]
      properties:
        name: { $ref: '#/components/schemas/RepositoryNameValue' }
        git_url:
          type: string
          description: 木の git リポジトリの URL。CLI は、ここから clone し、ブランチを push する
        root_hypothesis_id: { type: string, pattern: '^h-' }
        root_statement:
          type: [string, 'null']
          description: 根の仮説の主文（今の main）。スナップショットツリーがまだなければ null
        root_value: { $ref: '#/components/schemas/TruthValue' }
        directory:
          type: string
          description: ディレクトリの repository の、git リポジトリの中のパス。git リポジトリ全体の repository では空（../../design/directory/README.md）
        migrated_from:
          type: [object, 'null']
          description: 別リポジトリ方式から移した repository のとき、元の repository の名前と、移したコミット
          properties:
            repository: { type: string }
            commit: { type: string }
        migrated_to:
          type: [string, 'null']
          description: ほかの repository に移した、元の repository のとき、移した先の名前
        valid_commit:
          type: [string, 'null']
          description: |
            木を読む API が返す木のコミット。最新のコミットか、それより前の、いちばん新しい valid なコミットである。
            どれも valid でなければ null（../../design/backend/invalid-main.md）
        invalid_since:
          type: [string, 'null']
          description: valid_commit のあとの、最初の valid でないコミット。valid_commit がなければ最初のコミット。最新のコミットが valid なら null
    MainCommit:
      type: object
      required: [number, commit, committed_at, apply_request_id]
      properties:
        number:
          type: integer
          description: main のコミットの番号。最初のコミットを 1 とする
        commit: { $ref: '#/components/schemas/Commit' }
        committed_at: { type: string, format: date-time }
        apply_request_id:
          type: [string, 'null']
          description: 反映した apply request。worker が取り込むときに、反映した pull request の一覧から引く。見つからなければ null（../../design/backend/invalid-main.md の「どの apply request の反映か」）
    Commit:
      type: string
      minLength: 1
      description: コミットの SHA。不透明な文字列として扱う
    NextCursor:
      type: [string, 'null']
    NodeId:
      type: string
      pattern: '^[hs]-'
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    TruthValue:
      type: [boolean, 'null']
      description: true、false、null（未決）
    Statement:
      type: string
      description: 主文。文字数は info.description の決まりに従う
    Title:
      type: string
      description: タイトル。文字数は info.description の決まりに従う
    Summary:
      type: string
      description: 概要。文字数は info.description の決まりに従う

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            エラーの種類。code と HTTP の status は 1 対 1 である。
            | code | status | 意味 |
            |---|---|---|
            | validation_failed | 422 | 文字数や形が正しくない。または、不変条件を満たさない |
            | unauthenticated | 401 | トークンがない、正しくない、または Logiforge の主体でない |
            | forbidden | 403 | 主体の種類が、その操作を使えない。または、user でない主体が設定の API を使おうとした。または、GitForge が、この主体の操作を断った（権限が足りない） |
            | not_found | 404 | 対象がない |
            | not_open | 409 | open でない apply request を変えようとした。回答済みの人への依頼に回答しようとした。または、open でない apply request を apply_request に指定して読もうとした |
            | overlay_unsupported | 422 | apply request の向き先が main でないので、Logiforge は検査しない。レビューの材料を返せない |
            | overlay_conflict | 409 | apply request の差分を、今の main に重ねられない（向き先が main のときだけ）。detail に、衝突したパスを書く |
            | commit_conflict | 409 | レビューしたコミットが、ブランチの今の先頭のコミットと違う。または、merge の前に新しいコミットが push された |
            | stale_target | 409 | approve か merge で、対象ノードか引用した部分木が、ブランチが main から分かれたあとに変わっていた。または、分かれたコミットが今の main の履歴にない。detail に、何をすればよいかを書く |
            | conflict | 409 | approve か merge で、差分を今の main に重ねられない（git の衝突） |
            | invariant_violation | 409 | approve か merge で、差分を今の main に重ねた木が、不変条件を満たさない |
            | not_approved | 409 | merge しようとした apply request が、承認されていない（承認の状態が approved でない）。または、GitForge の承認を必須にする設定が、承認が足りないとして merge を断った |
            | merge_forbidden | 403 | 呼んだ主体に merge の権限がなく、GitForge が merge を断った |
            | too_large | 413 | ファイルが上限の大きさを超えた。または、要求の本文が 32 MiB を超えた |
            | repository_exists | 409 | 同じ名前の repository がすでにある |
            | unavailable | 503 | GitForge か、その git を読めない（止まっている、応答がない、制限に当たった）。少し待って送り直す |
            | snapshot_pending | 503 | 指定したコミットのスナップショットが、まだない（worker が取り込んでいない）。少し待って読み直す |
            | repository_not_registered | 422 | その名前の repository が、設定の DB に登録されていない。利用者が設定の画面で登録する repository（GitHub リポジトリとディレクトリ）だけで起きる |
            | setup_required | 503 | セットアップが終わっていない。セットアップの API と /healthz と、構成と client_id を置いたあとのサインインの中継のほかは、これを返す |
            | setup_done | 409 | セットアップが終わったあとに、セットアップの API（getSetup を除く）を呼んだ |
            | setup_in_progress | 409 | セットアップが、ほかのブラウザで進んでいる（セットアップのトークンがないか違う） |
            | internal | 500 | バックエンドの内部の誤り。詳しいことは、バックエンドのログにだけ書く |
          enum: [validation_failed, unauthenticated, forbidden, not_found, not_open, overlay_unsupported, overlay_conflict, commit_conflict, stale_target, conflict, invariant_violation, not_approved, merge_forbidden, too_large, repository_exists, unavailable, snapshot_pending, repository_not_registered, setup_required, setup_done, setup_in_progress, internal]

    Tree:
      type: object
      required: [root_hypothesis_id, root_value, commit, warnings]
      properties:
        root_hypothesis_id: { type: string, pattern: '^h-' }
        root_value: { $ref: '#/components/schemas/TruthValue' }
        commit: { $ref: '#/components/schemas/Commit' }
        valid_commit:
          type: [string, 'null']
          description: Repository の valid_commit と同じ（../../design/backend/invalid-main.md）
        invalid_since:
          type: [string, 'null']
          description: Repository の invalid_since と同じ
        warnings:
          type: array
          description: このコミットの警告（../../design/backend/worker/patrol.md の「コミットの警告」）
          items: { type: string }

    Node:
      oneOf:
        - $ref: '#/components/schemas/Hypothesis'
        - $ref: '#/components/schemas/Story'
      discriminator:
        propertyName: node_type
        mapping:
          hypothesis: '#/components/schemas/Hypothesis'
          story: '#/components/schemas/Story'
    Hypothesis:
      type: object
      required: [node_type, id, parent_story_id, statement, value, leaf, needs_reconsideration, inactive, open_apply_request_ids, open_human_request_ids]
      properties:
        node_type: { type: string, const: hypothesis }
        id: { type: string, pattern: '^h-' }
        parent_story_id:
          type: [string, 'null']
          description: 根のときだけ null
        statement: { $ref: '#/components/schemas/Statement' }
        background: { type: string }
        value: { $ref: '#/components/schemas/TruthValue' }
        valid_verdict_id: { type: [string, 'null'] }
        leaf:
          type: boolean
          description: 葉かどうか（../../docs/tree/README.md）
        needs_reconsideration:
          type: boolean
          description: 要再検討かどうか（../../docs/tree/propagation.md）
        inactive:
          type: boolean
          description: inactive かどうか（../../docs/tree/inactive.md）
        open_apply_request_ids:
          type: array
          description: このノードを対象にした open の apply request
          items: { type: string }
        open_human_request_ids:
          type: array
          description: このノードを対象にした open の人への依頼
          items: { type: string }
    Story:
      type: object
      required: [node_type, id, parent_hypothesis_id, title, summary, state, value, inactive, open_apply_request_ids, open_human_request_ids]
      properties:
        node_type: { type: string, const: story }
        id: { type: string, pattern: '^s-' }
        parent_hypothesis_id: { type: string, pattern: '^h-' }
        title: { $ref: '#/components/schemas/Title' }
        summary: { $ref: '#/components/schemas/Summary' }
        state: { type: string, enum: [active, inactive] }
        reason:
          type: [string, 'null']
          description: inactive にした理由
        value: { $ref: '#/components/schemas/TruthValue' }
        inactive:
          type: boolean
          description: inactive かどうか（../../docs/tree/inactive.md）
        open_apply_request_ids:
          type: array
          items: { type: string }
        open_human_request_ids:
          type: array
          items: { type: string }
    NodeDetail:
      type: object
      required: [commit, node, children, cited_by]
      properties:
        commit: { $ref: '#/components/schemas/Commit' }
        node: { $ref: '#/components/schemas/Node' }
        children:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        verdict:
          oneOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        cited_by:
          type: array
          description: このノードの部分木を引用している検証結果
          items: { type: string, pattern: '^v-' }

    Verdict:
      type: object
      required: [id, hypothesis_id, value, report_body, artifacts, citations, submitted_commit]
      properties:
        id: { type: string, pattern: '^v-' }
        hypothesis_id: { type: string, pattern: '^h-' }
        value: { type: boolean }
        report_body: { type: string }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        supersedes:
          type: array
          description: この検証結果が差し替えた検証結果の識別子
          items: { type: string, pattern: '^v-' }
        apply_request_id: { type: string, pattern: '^[1-9][0-9]*$' }
        submitted_commit: { $ref: '#/components/schemas/Commit' }
        superseded_commit:
          type: [string, 'null']
          description: 差し替えられた main のコミット。有効な間は null
    Citation:
      oneOf:
        - type: object
          required: [target_kind, sha256]
          properties:
            target_kind: { type: string, const: artifact }
            sha256:
              $ref: '#/components/schemas/Sha256'
              description: artifact の sha256。回答の添付は、ここではなく link の artifact で引用する（../../design/files/artifacts.md）
        - type: object
          required: [target_kind, node_id]
          description: 引用した時点は、検証結果が反映された main のコミット（Verdict の submitted_commit）である（../../docs/tree/verdict.md）
          properties:
            target_kind: { type: string, const: subtree }
            node_id: { $ref: '#/components/schemas/NodeId' }
    Artifact:
      type: object
      required: [kind, name]
      description: 決まりは ../../docs/tree/verdict.md に従う
      properties:
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        name: { type: string, minLength: 1 }
        sha256:
          $ref: '#/components/schemas/Sha256'
          description: file では必ずある。link では任意で、利用者やエージェントが照合に使う
        uri:
          type: string
          format: uri
          description: link のときの URL
        media_type: { type: string }
    ArtifactKind:
      type: string
      enum: [file, link]
    ArtifactInput:
      oneOf:
        - type: object
          required: [kind, name, content_base64]
          properties:
            kind: { type: string, const: file }
            name: { type: string, minLength: 1 }
            media_type: { type: string }
            content_base64:
              type: string
              format: byte
              description: 中身を base64 にしたもの。中身は 10 MiB まで
        - type: object
          required: [kind, name, uri]
          properties:
            kind: { type: string, const: link }
            name: { type: string, minLength: 1 }
            uri: { type: string, format: uri }
            sha256: { $ref: '#/components/schemas/Sha256' }
            media_type: { type: string }

    BranchName:
      type: string
      minLength: 1
      description: git のブランチの名前（refs/heads/ の後ろ）。main は使えない
    OperationInput:
      description: 差分から復元した操作。ファイルの変化と 1 対 1 に対応する（../../design/backend/README.md の「操作と差分」）。識別子は、差分のファイルに書かれたものである
      oneOf:
        - $ref: '#/components/schemas/StoryCreate'
        - $ref: '#/components/schemas/StoryInactivate'
        - $ref: '#/components/schemas/VerdictSubmit'
        - $ref: '#/components/schemas/NodeEdit'
      discriminator:
        propertyName: kind
        mapping:
          story.create: '#/components/schemas/StoryCreate'
          story.inactivate: '#/components/schemas/StoryInactivate'
          verdict.submit: '#/components/schemas/VerdictSubmit'
          node.edit: '#/components/schemas/NodeEdit'
    StoryCreate:
      type: object
      required: [kind, story_id, parent_hypothesis_id, title, summary, hypotheses]
      properties:
        kind: { type: string, const: story.create }
        story_id: { type: string, pattern: '^s-' }
        parent_hypothesis_id: { type: string, pattern: '^h-' }
        title: { $ref: '#/components/schemas/Title' }
        summary: { $ref: '#/components/schemas/Summary' }
        hypotheses:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, statement]
            properties:
              id: { type: string, pattern: '^h-' }
              statement: { $ref: '#/components/schemas/Statement' }
              background: { type: string }
    StoryInactivate:
      type: object
      required: [kind, story_id, reason]
      properties:
        kind: { type: string, const: story.inactivate }
        story_id: { type: string, pattern: '^s-' }
        reason: { type: string, minLength: 1 }
    VerdictSubmit:
      type: object
      required: [kind, verdict_id, hypothesis_id, value, report_body]
      properties:
        kind: { type: string, const: verdict.submit }
        verdict_id: { type: string, pattern: '^v-' }
        hypothesis_id: { type: string, pattern: '^h-' }
        value: { type: boolean }
        report_body: { type: string, minLength: 1 }
        supersedes:
          type: array
          description: 差し替える、同じ仮説の有効な検証結果の識別子。まとめて差し替えられる
          items: { type: string, pattern: '^v-' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
    NodeEdit:
      type: object
      required: [kind, hypothesis_id, append_background]
      properties:
        kind: { type: string, const: node.edit }
        hypothesis_id: { type: string, pattern: '^h-' }
        append_background:
          type: string
          minLength: 1
          description: 背景情報の末尾に加える文章
    Operation:
      allOf:
        - $ref: '#/components/schemas/OperationInput'
        - type: object
          required: [position]
          properties:
            position: { type: integer }

    ApplyRequestState:
      type: string
      enum: [open, merged, closed]
    ApplyRequest:
      type: object
      required: [id, state, branch, target, head_commit, head_commits, operations, reviews, comments, awaiting, warnings, webui_url]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        url:
          type: string
          format: uri
          description: GitForge の pull request の画面の URL
        branch:
          $ref: '#/components/schemas/BranchName'
          description: apply request を作ったときのブランチ
        target:
          type: string
          description: >-
            向き先（pull request の base のブランチ）。Logiforge が作るものは main。
            main でなければ、Logiforge は検査も反映もしない。operations は空で、作業の一覧に出ない（../../design/backend/apply-request/target.md の「向き先」）
        state: { $ref: '#/components/schemas/ApplyRequestState' }
        opened_by_caller:
          type: boolean
          description: 要求を送った主体が、この apply request を作った主体（pull request の作者）と同じか。WebUI は、approve の前に示す（../../design/settings/users.md の「WebUI からのレビュー」）
        head_commit:
          $ref: '#/components/schemas/Commit'
          description: ブランチの今の先頭のコミット。レビューと反映は、このコミットを SHA で指す
        head_commits:
          type: array
          description: ブランチに push された先頭のコミットの一覧（古い順）。worker が見つけた時刻を持つ（../../design/backend/apply-request/README.md の「先頭のコミット」）
          items:
            type: object
            required: [commit, base_commit, seen_at]
            properties:
              commit:
                $ref: '#/components/schemas/Commit'
              base_commit:
                type: string
                description: そのコミットと main の分かれた点。差分は、ここからの差分である。worker がまだ取り込んでいなければ空
              seen_at:
                type: [string, 'null']
                format: date-time
                description: worker が、そのコミットをブランチの先頭として見つけた時刻（push のおおよその時刻）。worker がまだ取り込んでいなければ null
        description: { type: string }
        operations:
          type: array
          items: { $ref: '#/components/schemas/Operation' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        comments:
          type: array
          description: >-
            pull request のコメント（古い順）。1 件を読むときだけ入り、一覧では空である。
            反映の失敗と close の理由も、人が読む文で、ここに入る。Logiforge は、コメントの本文を読まない（../../design/adapters/texts.md）
          items:
            type: object
            required: [author, body, created_at]
            properties:
              author: { type: string, description: コメントを書いた GitForge のアカウント }
              body: { type: string }
              created_at: { type: [string, 'null'], format: date-time }
        awaiting:
          type: [string, 'null']
          enum: [review, fix, null]
          description: open のとき、レビュー待ち（review）か修正待ち（fix）か。どちらのラベルもなければ（approve されて merge を待つもの）null。向き先（target）が main でない apply request でも null
        review_decision:
          type: [string, 'null']
          enum: [approved, changes_requested, pending, null]
          description: |
            承認の状態（../../docs/apply-request/review.md の「反映の条件」）。approved は承認済み、changes_requested は変更を求められている、pending はまだ。
            分からなければ null。一覧では、GitForge によっては分からず null になる。1 件を読めば入る
        warnings:
          type: array
          description: 警告。例：向き先が main でないので、Logiforge は確かめていない（../../design/backend/merge.md）
          items: { type: string }
        merged_commit:
          type: [string, 'null']
          description: 反映した main のコミット。反映されていなければ null
        outside_paths:
          type: [array, 'null']
          items: { type: string }
          description: >-
            ディレクトリの repository で、先頭のコミットが、ディレクトリの外で変えたパス（repository の根からのパス）。変えていなければ空。
            ふつうの repository と、先頭のコミットを worker がまだ取り込んでいないときは null
        webui_url:
          type: [string, 'null']
          format: uri
          description: >-
            この apply request を WebUI で開く URL（`<webui_url>/r/{repository}/apply-requests?id={id}`。../../design/webui/screens.md の「URL」）。
            設定の webui_url から組み立てる。設定になければ null
    ReviewKind:
      type: string
      enum: [approve, request_changes, comment]
    Review:
      type: object
      required: [id, kind, commit, valid]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        kind: { $ref: '#/components/schemas/ReviewKind' }
        commit:
          $ref: '#/components/schemas/Commit'
          description: レビューした先頭のコミット
        body: { type: string }
        valid:
          type: boolean
          description: ブランチの今の先頭のコミットに対するレビューなら真
        reviewer:
          type: string
          description: レビューを書いた主体（GitForge の利用者の名前）。議論で、だれが書いたかを示すのに使う
        created_at:
          type: [string, 'null']
          format: date-time
          description: レビューを書いた時刻（GitForge のコメントの時刻）。読めなければ null。reviews は、この順に並ぶ
    ReviewMaterial:
      type: object
      description: 材料に含めるものは ../../docs/apply-request/review.md に従う
      required: [apply_request_id, commit, operations, targets, ancestors, siblings, citations]
      properties:
        apply_request_id: { type: string, pattern: '^[1-9][0-9]*$' }
        commit: { $ref: '#/components/schemas/Commit' }
        operations:
          type: array
          description: 差分そのもの
          items: { $ref: '#/components/schemas/Operation' }
        targets:
          type: array
          description: 操作の対象ノードの、現在の状態と値
          items: { $ref: '#/components/schemas/Node' }
        ancestors:
          type: array
          description: 対象ノードの親仮説から根までの仮説（主文を含む）
          items: { $ref: '#/components/schemas/Hypothesis' }
        siblings:
          type: array
          description: 兄弟ストーリー（タイトル、概要、値）
          items: { $ref: '#/components/schemas/Story' }
        citations:
          type: array
          description: 引用している部分木（先頭のコミットの木のもの）と artifact
          items:
            type: object
            required: [citation]
            properties:
              citation: { $ref: '#/components/schemas/Citation' }
              nodes:
                type: array
                description: 部分木の引用だけ。先頭のコミットの木の、引用した部分木のノード
                items: { $ref: '#/components/schemas/Node' }
              artifact: { $ref: '#/components/schemas/Artifact' }

    WorkKind:
      type: string
      enum: [undecided_leaf, needs_reconsideration, review_waiting, fix_waiting, approved, human_request_answered, citation_changed]
    WorkItem:
      type: object
      required: [kind, subject_id]
      description: |
        各種類の定義は ../../docs/work/README.md に従う。
        human_request_answered は、回答の artifact を引用した apply request が open になるか反映されたとき、
        または回答のあとに対象ノードについての apply request が反映されたときに、作業から外れる。
      properties:
        kind: { $ref: '#/components/schemas/WorkKind' }
        subject_id:
          type: string
          description: |
            作業の対象の識別子。
            undecided_leaf と needs_reconsideration では仮説、review_waiting と fix_waiting と approved では apply request、
            human_request_answered では人への依頼、citation_changed では引用している検証結果（v-…）の識別子である。
        node_id:
          $ref: '#/components/schemas/NodeId'
          description: 作業の対象のノード。citation_changed では、検証結果を持つ仮説である
    Completion:
      type: object
      required: [commit, root_value, decided, remaining_work, done]
      properties:
        commit: { $ref: '#/components/schemas/Commit' }
        valid_commit: { type: [string, 'null'], description: Repository の valid_commit と同じ（../../design/backend/invalid-main.md） }
        invalid_since: { type: [string, 'null'], description: Repository の invalid_since と同じ }
        root_value: { $ref: '#/components/schemas/TruthValue' }
        decided:
          type: boolean
          description: 根の値が true か false
        remaining_work:
          type: integer
          description: 根拠部分木で着手できる作業の件数。数え方は ../../docs/work/README.md に従う
        done:
          type: boolean
          description: decided が真で、remaining_work が 0

    HumanRequestKind:
      type: string
      enum: [pvr, decision]
    HumanRequestState:
      type: string
      enum: [open, answered]
    HumanRequest:
      type: object
      required: [id, node_id, kind, body, state]
      description: 決まりは ../../docs/human-requests/README.md に従う
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        node_id: { $ref: '#/components/schemas/NodeId' }
        kind: { $ref: '#/components/schemas/HumanRequestKind' }
        body: { type: string }
        state: { $ref: '#/components/schemas/HumanRequestState' }
        answer:
          oneOf:
            - type: 'null'
            - type: object
              required: [body, attachments, answered_at]
              properties:
                body: { type: string }
                attachments:
                  type: array
                  description: 添付。file のものは、getAnswerAttachment で読む。引用するときは、その URL の link にする（../../design/files/artifacts.md）
                  items: { $ref: '#/components/schemas/Artifact' }
                answered_at: { type: string, format: date-time }

    NodeHistoryEntry:
      type: object
      required: [commit, committed_at, apply_request_id, reflected]
      description: main のコミットの情報から作る（design/files/revisions.md）
      properties:
        commit: { $ref: '#/components/schemas/Commit' }
        committed_at: { type: string, format: date-time }
        apply_request_id:
          type: [string, 'null']
          description: 反映した apply request。見つからなかったコミットでは null（../../design/backend/invalid-main.md の「どの apply request の反映か」）
        reflected:
          type: boolean
          description: 反映した apply request が見つかったか。表示だけに使う
    NodeHistoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NodeHistoryEntry' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
