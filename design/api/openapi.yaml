openapi: 3.1.0
info:
  title: Logiforge API
  version: 0.1.0
  description: |
    Logiforge のバックエンドの API。
    全体に共通する決まり（主体と認証、セッション ID、コミット、エラー、ページング）は design/api/README.md に書く。
    要件は docs/ が正本である。
    主文・タイトル・概要の文字数の上限と数え方は、../../docs/tree/README.md に従う。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /v1
    description: Logiforge を置いたホストからの相対パス
security:
  - bearerAuth: []
tags:
  - name: repository
    description: repository の作成と参照
  - name: tree
    description: 木の参照
  - name: apply-request
    description: apply request と論理レビュー
  - name: work
    description: 着手できる作業と、作業の終わりの判定
  - name: evidence
    description: artifact、検証結果、レポート
  - name: human-request
    description: 人への依頼（PVR と判断の依頼）
  - name: history
    description: 履歴とエクスポート
  - name: oauth
    description: WebUI のサインイン（Forgejo の OAuth2 の中継）

paths:
  /oauth/config:
    get:
      tags: [oauth]
      operationId: getOAuthConfig
      summary: WebUI のサインインに使う OAuth2 の設定
      description: 認証を求めない。設計は ../../design/webui/auth.md に従う。
      security: []
      responses:
        '200':
          description: authorize の URL など
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, client_id, redirect_uri, scope, gitforge]
                properties:
                  authorize_url: { type: string, format: uri }
                  gitforge: { type: string, enum: [forgejo, github], description: 'サインインする GitForge。画面の文言に使う' }
                  client_id: { type: string }
                  redirect_uri: { type: string, format: uri }
                  scope: { type: string, description: 'スペースで区切ったスコープ（read:user read:organization）' }
  /oauth/token:
    post:
      tags: [oauth]
      operationId: exchangeOAuthCode
      summary: 認可コードをアクセストークンに交換する（BE が client secret を足して Forgejo に中継する）
      description: 認証を求めない。BE は、受け取ったものも返すものも保持しない。決まりは ../../design/webui/oauth-relay.md に従う。Forgejo が拒んだら unauthenticated。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                code: { type: string }
                code_verifier: { type: string }
      responses:
        '200':
          description: Forgejo の応答
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthToken' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /repositories:
    get:
      tags: [repository]
      operationId: listRepositories
      summary: repository の一覧
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: repository の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Repository' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [repository]
      operationId: createRepository
      summary: repository を作る（user だけ。根の仮説の主文を一緒に受け取る）
      description: |
        repository の用意の手順は ../../design/backend/README.md に従う。
        GitForge 側の参照は、GitForge アダプタから求める（../../design/adapters/README.md）。
        送り直しは、repository の用意の判定で見分ける。Idempotency-Key は使わない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/RepositoryNameValue' }
                statement:
                  $ref: '#/components/schemas/Statement'
                  description: 根の仮説の主文。migrate_from がなければ必須で、あれば渡さない
                migrate_from:
                  type: string
                  description: 別リポジトリ方式から移すときの、元の repository の名前（../../design/directory/migrate.md）。移した先は、ディレクトリの repository である
                background: { type: string }
      responses:
        '201':
          description: 作った repository
          headers:
            Logiforge-Pending-Commit: { $ref: '#/components/headers/PendingCommit' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [repository]
      operationId: getRepository
      summary: repository
      responses:
        '200':
          description: repository
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/repair-files:
    get:
      tags: [repository]
      operationId: getRepairFiles
      summary: 壊れた repository の、最後に正しかった時点のファイル（CLI の repair revert が使う）
      description: |
        最後に正しかった時点のコミットの tree/ と artifacts/ のファイルを、スナップショットツリーと artifact の置き場から返す。
        壊れていなければ not_found。設計は ../../design/backend/broken.md に従う
      parameters:
        - $ref: '#/components/parameters/RepositoryName'
      responses:
        '200':
          description: ファイルの一覧
          content:
            application/json:
              schema:
                type: object
                required: [commit, files]
                properties:
                  commit: { type: string, description: 最後に正しかった時点のコミット }
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, content_base64]
                      properties:
                        path: { type: string }
                        content_base64: { type: string }
        '4XX': { $ref: '#/components/responses/Problem' }
  /repositories/{repository}/tree:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [tree]
      operationId: getTree
      summary: 木の概要
      parameters:
        - $ref: '#/components/parameters/Commit'
        - $ref: '#/components/parameters/ApplyRequestView'
      responses:
        '200':
          description: 木の概要。根がまだなければ 404
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tree' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /repositories/{repository}/tree/nodes:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [tree]
      operationId: listNodes
      summary: 木または部分木のノード
      description: |
        `root` を指定すると、そのノードを根とする部分木だけを返す。
        `commit` を指定すると、その main のコミットの木を返す。
        `apply_request` を指定すると、その apply request を反映したあとの木を返す。
      parameters:
        - $ref: '#/components/parameters/Commit'
        - $ref: '#/components/parameters/ApplyRequestView'
        - name: root
          in: query
          description: 部分木の根にするノード。apply_request を指定したとき、その apply request を反映すると消えるノードは not_found（404）になる
          schema: { $ref: '#/components/schemas/NodeId' }
        - name: depth
          in: query
          description: 部分木の根から何段までを返すか。指定しなければすべて
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: ノードの一覧
          content:
            application/json:
              schema:
                type: object
                required: [commit, nodes]
                properties:
                  commit: { $ref: '#/components/schemas/Commit' }
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/Node' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/tree/completion:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [work]
      operationId: getCompletion
      summary: 作業の終わりの判定
      responses:
        '200':
          description: 判定の結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Completion' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/tree/export:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [history]
      operationId: exportTree
      summary: 木を JSON か Markdown で書き出す
      description: 形は ../../design/api/export.md に従う。
      parameters:
        - $ref: '#/components/parameters/Commit'
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [json, markdown] }
      responses:
        '200':
          description: 書き出した木
          content:
            application/json:
              schema: { type: object }
            text/markdown:
              schema: { type: string }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/commits:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [history]
      operationId: listCommits
      summary: main のコミットの一覧（新しい順）
      description: |
        worker が取り込んだ main のコミットを、新しい順に返す（../../design/backend/snapshot.md の「コミットの記録から引くもの」）。
        カーソルは、次に読むコミットの number である。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: main のコミットの一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MainCommit' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [tree]
      operationId: getNode
      summary: ノードの詳細
      description: apply_request を指定したとき、その apply request を反映すると消えるノードは not_found（404）になる。
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
        - $ref: '#/components/parameters/Commit'
        - $ref: '#/components/parameters/ApplyRequestView'
      responses:
        '200':
          description: ノードの詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/nodes/{nodeId}/history:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [history]
      operationId: getNodeHistory
      summary: ノードの履歴
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: そのノードのパスを変えた、main のコミットの一覧（新しい順）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeHistoryPage' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [apply-request]
      operationId: listApplyRequests
      summary: apply request の一覧
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ApplyRequestState' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: apply request の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApplyRequest' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [apply-request]
      operationId: createApplyRequest
      summary: apply request を作る（client だけ）
      description: |
        push したブランチから main への pull request を作る。ブランチの先頭のコミットが、最初の先頭のコミットになる。手順は ../../design/backend/apply-request.md に従う。
        差分が 4 種類の操作として読めなければ、validation_failed で受け付けない。操作は、差分から復元して応答に入れる。
        そのブランチに open の apply request がすでにあれば、validation_failed で受け付けない。
        バックエンドが、作業用の git の複製からブランチを読んで検査する。worker を待たない（../../design/backend/apply-request.md の「作成」）。
        先頭のコミットのスナップショットは、worker がブランチを取り込んでから読む側に出る。それまで、そのコミットへのレビューは snapshot_pending になる。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              properties:
                branch: { $ref: '#/components/schemas/BranchName' }
                kind:
                  type: string
                  enum: [change, repair.revert, repair.accept]
                  default: change
                  description: 直すための apply request の種類（../../design/backend/broken.md）。指定しなければ、ふつうの apply request
                commit:
                  $ref: '#/components/schemas/Commit'
                  description: 取り込むコミット。ブランチの今の先頭と違えば、validation_failed で受け付けない。指定しなければ、ブランチの今の先頭
                description:
                  type: string
                  description: 説明欄。レビューの材料には含めない
      responses:
        '201':
          description: 作った apply request
          headers:
            Logiforge-Pending-Commit: { $ref: '#/components/headers/PendingCommit' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [apply-request]
      operationId: getApplyRequest
      summary: apply request の詳細（差分、レビュー、反映の失敗）
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      responses:
        '200':
          description: apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [apply-request]
      operationId: updateApplyRequest
      summary: apply request の説明欄を書き換える（client なら、どのセッションからでもよい）
      description: |
        新しいコミットは、利用者がブランチに push するだけで、この API は使わない（../../design/backend/apply-request.md）。
        この API は、説明欄だけを書き換える。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
      responses:
        '200':
          description: 更新した apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}/reviews:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    post:
      tags: [apply-request]
      operationId: reviewApplyRequest
      summary: レビューを付ける（client だけ。差分を書いたどのセッションとも別のセッション）
      description: |
        `approve` で反映の条件を満たしたら、この要求の中で反映する。
        反映に失敗しても、エラーにはしない。応答の `apply_request.merge_failures` に理由が入る。
        先頭のコミットに Logiforge-Session-Id: がなければ、approve は validation_failed で受け付けない（../../design/files/revisions.md の「セッション」）。
        先頭のコミットが GitForge にはあるが、worker がまだスナップショットにしていなければ、どの種類のレビュー（approve、request_changes、comment）も付けられず、snapshot_pending を返す。少し待って送り直す。
        レビューの鎖が切れていれば、not_open で受け付けない。opener は、close して、同じブランチから作り直す（../../design/backend/merge.md の「レビューの鎖が切れたとき」）。
        reviewer の主体が、apply request を作った主体と同じなら、応答の apply_request.warnings に警告を入れる。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, commit]
              properties:
                kind: { $ref: '#/components/schemas/ReviewKind' }
                commit:
                  $ref: '#/components/schemas/Commit'
                  description: レビューした先頭のコミットの SHA（../../design/backend/apply-request.md）。ブランチの今の先頭のコミットと違えば commit_conflict で受け付けない
                body: { type: string }
                prompt_revision:
                  type: string
                  description: 使ったプロンプトのリビジョン。approve では必須
      responses:
        '201':
          description: 付けたレビューと、その後の apply request
          headers:
            Logiforge-Pending-Commit: { $ref: '#/components/headers/PendingCommit' }
          content:
            application/json:
              schema:
                type: object
                required: [review, apply_request]
                properties:
                  review: { $ref: '#/components/schemas/Review' }
                  apply_request: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}/close:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    post:
      tags: [apply-request]
      operationId: closeApplyRequest
      summary: apply request を close する（却下または取り下げ）
      description: |
        差分を書いたいずれかのセッションからなら、取り下げとして扱う。
        それ以外のセッションからなら、却下として扱う。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: close した apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/apply-requests/{applyRequestId}/review-material:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [apply-request]
      operationId: getReviewMaterial
      summary: レビューの材料
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      responses:
        '200':
          description: 先頭のコミットの差分に対するレビューの材料。説明欄は含めない。apply request の向き先が main でなければ overlay_unsupported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewMaterial' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/work:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [work]
      operationId: listWork
      summary: 着手できる作業
      parameters:
        - name: subtree
          in: query
          description: この部分木の中の作業だけを返す
          schema: { $ref: '#/components/schemas/NodeId' }
        - name: kind
          in: query
          description: 返す作業の種類。指定しなければすべて
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkKind' }
          style: form
          explode: false
        - name: include_claimed
          in: query
          description: 真なら、open の apply request が対象にしているノードの作業も返す
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 着手できる作業
          content:
            application/json:
              schema:
                type: object
                required: [commit, counts, items, next_cursor]
                properties:
                  commit: { $ref: '#/components/schemas/Commit' }
                  counts:
                    type: object
                    description: 種類ごとの件数（ページに関わらず全体）
                    additionalProperties: { type: integer }
                  items:
                    type: array
                    description: 作業の種類の順、次にノードの識別子の順、次に subject_id の順。カーソルは commit に結びつける（../../design/api/README.md のページング）
                    items: { $ref: '#/components/schemas/WorkItem' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/artifacts/{sha256}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [evidence]
      operationId: getArtifact
      summary: artifact のファイルを読む
      description: 指定したコミット（main のコミットのほか、apply request の先頭のコミットも指定できる）の artifacts/ から、file の artifact の中身を読む
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Sha256' }
        - $ref: '#/components/parameters/Commit'
      responses:
        '200':
          description: 中身
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/verdicts/{verdictId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [evidence]
      operationId: getVerdict
      summary: 検証結果とレポート
      parameters:
        - name: verdictId
          in: path
          required: true
          schema: { type: string, pattern: '^v-' }
      responses:
        '200':
          description: 検証結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verdict' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/human-requests:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [human-request]
      operationId: listHumanRequests
      summary: 人への依頼の一覧
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/HumanRequestKind' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/HumanRequestState' }
        - name: node_id
          in: query
          schema: { $ref: '#/components/schemas/NodeId' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 人への依頼の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HumanRequest' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [human-request]
      operationId: createHumanRequest
      summary: 人への依頼を起票する（client だけ）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, kind, body]
              properties:
                node_id: { $ref: '#/components/schemas/NodeId' }
                kind: { $ref: '#/components/schemas/HumanRequestKind' }
                body:
                  type: string
                  minLength: 1
                  description: 検証手順、または問い
      responses:
        '201':
          description: 起票した人への依頼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/human-requests/{humanRequestId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [human-request]
      operationId: getHumanRequest
      summary: 人への依頼と、その回答
      parameters:
        - $ref: '#/components/parameters/HumanRequestId'
      responses:
        '200':
          description: 人への依頼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/human-requests/{humanRequestId}/attachments/{sha256}:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    get:
      tags: [human-request]
      operationId: getAnswerAttachment
      summary: 回答の添付のファイルを読む
      parameters:
        - $ref: '#/components/parameters/HumanRequestId'
        - name: sha256
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Sha256' }
      responses:
        '200':
          description: 中身
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '4XX': { $ref: '#/components/responses/Problem' }

  /repositories/{repository}/human-requests/{humanRequestId}/answer:
    parameters:
      - $ref: '#/components/parameters/RepositoryName'
    post:
      tags: [human-request]
      operationId: answerHumanRequest
      summary: 人への依頼に回答する（user だけ。1 回だけ）
      description: |
        送り直しは、回答がすでにあり、本文と回答した利用者が同じなら、成功とする。Idempotency-Key は使わない。
        回答と添付は、git ではなく、GitForge の側に置く（../../design/files/artifacts.md）。
        GitForge がコメントにファイルを添付できない構成では、添付は link だけで、file は validation_failed で受け付けない。
      parameters:
        - $ref: '#/components/parameters/HumanRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
                attachments:
                  type: array
                  items: { $ref: '#/components/schemas/ArtifactInput' }
      responses:
        '201':
          description: 回答した人への依頼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 主体（user または client）を示すトークン

  parameters:
    RepositoryName:
      name: repository
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RepositoryNameValue' }
    NodeIdPath:
      name: nodeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NodeId' }
    ApplyRequestId:
      name: applyRequestId
      in: path
      required: true
      schema: { type: string, pattern: '^apr_' }
    HumanRequestId:
      name: humanRequestId
      in: path
      required: true
      schema: { type: string, pattern: '^hrq_' }
    Commit:
      name: commit
      in: query
      description: >-
        読むコミットの SHA。main のコミットか、worker がブランチのスナップショットを作ったブランチのコミットである。指定しなければ、今の main のコミット（latest）。
        ブランチのコミットのスナップショットツリーは、その base の main のスナップショットツリーにブランチの差分を重ねて、読むたびに作る（../../design/backend/snapshot.md の「ブランチのコミットのスナップショットツリー」）。
        worker が、まだそのコミットを取り込んでいなければ、snapshot_pending になる。少し待って送り直す。
      schema: { $ref: '#/components/schemas/Commit' }
    ApplyRequestView:
      name: apply_request
      in: query
      description: >-
        open の apply request の識別子。指定すると、その先頭のコミットの差分を、向き先の今の先頭のスナップショットツリーに重ねた、
        反映したあとの木を返す（../../design/backend/snapshot.md の「向き先に重ねる」）。応答の commit は、重ねた向き先のコミットである。
        向き先が main なら、今の先頭は latest である。向き先が main でなければ、向き先のブランチの履歴の最後のコミットである。このとき、Logiforge は検査しないので、値は決まりに沿っているかを確かめていない。
        commit と同時には指定できない（validation_failed）。
        向き先が main で、重ねられなければ overlay_conflict を返す。向き先が main でなければ、衝突は判定しない（差分が変えたパスは先頭のファイル、ほかは向き先のファイルを使う）。先頭のコミットか、向き先の今の先頭のスナップショットがまだなければ snapshot_pending、open でなければ not_open を返す。
        向き先のブランチが消えていれば、not_found を返す。
        その識別子の apply request がこの repository になければ（ほかの repository のものを含む）、not_found を返す。
        getNode の nodeId と listNodes の root に、その apply request を反映すると消えるノードを指定したときも、not_found を返す。反映したあとの木に、そのノードがないからである。
      schema: { type: string, pattern: '^apr_' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    SessionId:
      name: Logiforge-Session-Id
      in: header
      required: true
      description: client のセッション ID
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        送り直しを見分けるキー。repository の名前・主体・キーから、作るものの識別子を決定的に作る。
        同じ識別子のものがすでにあれば、新しく作らずに、それを返す。要求の中身は比べない。
        決まりは ../../design/api/writes.md の「同じ要求の繰り返し」に従う。
      schema: { type: string, minLength: 1, maxLength: 128 }

  headers:
    RepositoryBroken:
      description: |
        repository が壊れているときに、repository と木を読む応答（getRepository、木、ノード、検証結果）に付ける。値は、最後に正しかった時点のコミット。
        apply request と人への依頼を読む応答には付けない。
        応答の木は、そのコミットのものである（../../design/backend/broken.md）
      schema: { type: string }
    PendingCommit:
      description: |
        書いたものが、待つ時間の上限までに読む側に出なかったときに付ける。値は、読む側に出るのを待っているコミット。
        決まりは ../../design/api/writes.md の「書いた直後の読み」に従う
      schema: { type: string }

  responses:
    Problem:
      description: エラー
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    OAuthToken:
      type: object
      description: リフレッシュトークンは含めない（../../design/webui/auth.md の「トークンの持ち方」）
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer, description: アクセストークンの寿命（秒） }
    RepositoryNameValue:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      description: repository の名前。Logiforge の中で一意
    Repository:
      type: object
      required: [name, root_hypothesis_id, git_url]
      properties:
        name: { $ref: '#/components/schemas/RepositoryNameValue' }
        git_url:
          type: string
          description: 木の git リポジトリの URL。CLI は、ここから clone し、ブランチを push する
        root_hypothesis_id: { type: string, pattern: '^h-' }
        root_statement:
          type: [string, 'null']
          description: 根の仮説の主文（今の main）。スナップショットツリーがまだなければ null
        root_value: { $ref: '#/components/schemas/TruthValue' }
        directory:
          type: string
          description: ディレクトリの repository の、git リポジトリの中のパス。git リポジトリ全体の repository では空（../../design/directory/README.md）
        migrated_from:
          type: [object, 'null']
          description: 別リポジトリ方式から移した repository のとき、元の repository の名前と、移したコミット
          properties:
            repository: { type: string }
            commit: { type: string }
        migrated_to:
          type: [string, 'null']
          description: ほかの repository に移した、元の repository のとき、移した先の名前
        broken:
          type: [object, 'null']
          description: |
            壊れていれば、壊れた最初のコミットと、最後に正しかった時点のコミット。壊れていなければ null。
            壊れているあいだ、木を読む API は、最後に正しかった時点の木を返す（../../design/backend/broken.md）
          required: [first_commit, last_good_commit, reason]
          properties:
            first_commit: { type: string }
            last_good_commit: { type: string }
            reason: { type: string, enum: [no_apply_request, main_rewritten] }
    MainCommit:
      type: object
      required: [number, commit, committed_at, apply_request_id]
      properties:
        number:
          type: integer
          description: main のコミットの番号。最初のコミットを 1 とする
        commit: { $ref: '#/components/schemas/Commit' }
        committed_at: { type: string, format: date-time }
        apply_request_id:
          type: [string, 'null']
          description: 反映した apply request。コミットの記録の trailer（Logiforge-Apply-Request）の値。反映によらないコミットでは null
    Commit:
      type: string
      minLength: 1
      description: コミットの SHA。不透明な文字列として扱う
    NextCursor:
      type: [string, 'null']
    NodeId:
      type: string
      pattern: '^[hs]-'
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    TruthValue:
      type: [boolean, 'null']
      description: true、false、null（未決）
    Statement:
      type: string
      description: 主文。文字数は info.description の決まりに従う
    Title:
      type: string
      description: タイトル。文字数は info.description の決まりに従う
    Summary:
      type: string
      description: 概要。文字数は info.description の決まりに従う

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            エラーの種類。code と HTTP の status は 1 対 1 である。
            | code | status | 意味 |
            |---|---|---|
            | validation_failed | 422 | 文字数や形が正しくない。または、不変条件を満たさない |
            | unauthenticated | 401 | トークンがない、正しくない、または Logiforge の主体でない |
            | forbidden | 403 | 主体の種類が、その操作を使えない |
            | session_required | 400 | Logiforge-Session-Id がない |
            | not_found | 404 | 対象がない |
            | same_session | 403 | 差分を書いたどれかのセッションと同じセッションでレビューした |
            | not_open | 409 | open でない apply request を変えようとした。レビューの鎖が切れた apply request にレビューしようとした（detail に、opener の手：close して、同じブランチから作り直す）。または、回答済みの人への依頼に回答しようとした。または、open でない apply request を apply_request に指定して読もうとした |
            | overlay_unsupported | 422 | apply request の向き先が main でないので、Logiforge は検査しない。レビューの材料を返せない |
            | overlay_conflict | 409 | apply request の差分を、今の main に重ねられない（向き先が main のときだけ）。detail に、衝突したパスを書く |
            | commit_conflict | 409 | レビューしたコミットが、ブランチの今の先頭のコミットと違う。または、反映の前に新しいコミットが push された |
            | too_large | 413 | ファイルが上限の大きさを超えた。または、要求の本文が 32 MiB を超えた |
            | repository_exists | 409 | 同じ名前の repository がすでにある |
            | unavailable | 503 | GitForge の git を読めない。少し待って送り直す |
            | snapshot_pending | 503 | 指定したコミットのスナップショットが、まだない（worker が取り込んでいない）。少し待って読み直す |
            | repository_not_registered | 422 | その名前の repository が、サーバの設定に登録されていない。repository の登録をサーバの設定で行う構成だけで起きる |
            | internal | 500 | バックエンドの内部の誤り。詳しいことは、バックエンドのログにだけ書く |
          enum: [validation_failed, unauthenticated, forbidden, session_required, not_found, same_session, not_open, overlay_unsupported, overlay_conflict, commit_conflict, too_large, repository_exists, unavailable, snapshot_pending, repository_not_registered, internal]

    Tree:
      type: object
      required: [root_hypothesis_id, root_value, commit, warnings]
      properties:
        root_hypothesis_id: { type: string, pattern: '^h-' }
        root_value: { $ref: '#/components/schemas/TruthValue' }
        commit: { $ref: '#/components/schemas/Commit' }
        warnings:
          type: array
          description: 反映の手順によらない変更が木にあるときの警告
          items: { type: string }

    Node:
      oneOf:
        - $ref: '#/components/schemas/Hypothesis'
        - $ref: '#/components/schemas/Story'
      discriminator:
        propertyName: node_type
        mapping:
          hypothesis: '#/components/schemas/Hypothesis'
          story: '#/components/schemas/Story'
    Hypothesis:
      type: object
      required: [node_type, id, parent_story_id, statement, value, leaf, needs_reconsideration, inactive, open_apply_request_ids, open_human_request_ids]
      properties:
        node_type: { type: string, const: hypothesis }
        id: { type: string, pattern: '^h-' }
        parent_story_id:
          type: [string, 'null']
          description: 根のときだけ null
        statement: { $ref: '#/components/schemas/Statement' }
        background: { type: string }
        value: { $ref: '#/components/schemas/TruthValue' }
        valid_verdict_id: { type: [string, 'null'] }
        leaf:
          type: boolean
          description: 葉かどうか（../../docs/tree/README.md）
        needs_reconsideration:
          type: boolean
          description: 要再検討かどうか（../../docs/tree/propagation.md）
        inactive:
          type: boolean
          description: inactive かどうか（../../docs/tree/inactive.md）
        open_apply_request_ids:
          type: array
          description: このノードを対象にした open の apply request
          items: { type: string }
        open_human_request_ids:
          type: array
          description: このノードを対象にした open の人への依頼
          items: { type: string }
    Story:
      type: object
      required: [node_type, id, parent_hypothesis_id, title, summary, state, value, inactive, open_apply_request_ids, open_human_request_ids]
      properties:
        node_type: { type: string, const: story }
        id: { type: string, pattern: '^s-' }
        parent_hypothesis_id: { type: string, pattern: '^h-' }
        title: { $ref: '#/components/schemas/Title' }
        summary: { $ref: '#/components/schemas/Summary' }
        state: { type: string, enum: [active, inactive] }
        reason:
          type: [string, 'null']
          description: inactive にした理由
        value: { $ref: '#/components/schemas/TruthValue' }
        inactive:
          type: boolean
          description: inactive かどうか（../../docs/tree/inactive.md）
        open_apply_request_ids:
          type: array
          items: { type: string }
        open_human_request_ids:
          type: array
          items: { type: string }
    NodeDetail:
      type: object
      required: [commit, node, children, cited_by]
      properties:
        commit: { $ref: '#/components/schemas/Commit' }
        node: { $ref: '#/components/schemas/Node' }
        children:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        verdict:
          oneOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        cited_by:
          type: array
          description: このノードの部分木を引用している検証結果
          items: { type: string, pattern: '^v-' }

    Verdict:
      type: object
      required: [id, hypothesis_id, value, report_body, artifacts, citations, submitted_commit]
      properties:
        id: { type: string, pattern: '^v-' }
        hypothesis_id: { type: string, pattern: '^h-' }
        value: { type: boolean }
        report_body: { type: string }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        supersedes:
          type: array
          description: この検証結果が差し替えた検証結果の識別子
          items: { type: string, pattern: '^v-' }
        apply_request_id: { type: string, pattern: '^apr_' }
        submitted_commit: { $ref: '#/components/schemas/Commit' }
        superseded_commit:
          type: [string, 'null']
          description: 差し替えられた main のコミット。有効な間は null
    Citation:
      oneOf:
        - type: object
          required: [target_kind, sha256]
          properties:
            target_kind: { type: string, const: artifact }
            sha256:
              $ref: '#/components/schemas/Sha256'
              description: artifact の sha256。回答の添付は、ここではなく link の artifact で引用する（../../design/files/artifacts.md）
        - type: object
          required: [target_kind, node_id, commit]
          properties:
            target_kind: { type: string, const: subtree }
            node_id: { $ref: '#/components/schemas/NodeId' }
            commit: { $ref: '#/components/schemas/Commit' }
    Artifact:
      type: object
      required: [kind, name]
      description: 決まりは ../../docs/tree/verdict.md に従う
      properties:
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        name: { type: string, minLength: 1 }
        sha256:
          $ref: '#/components/schemas/Sha256'
          description: file では必ずある。link では任意で、利用者やエージェントが照合に使う
        uri:
          type: string
          format: uri
          description: link のときの URL
        media_type: { type: string }
    ArtifactKind:
      type: string
      enum: [file, link]
    ArtifactInput:
      oneOf:
        - type: object
          required: [kind, name, content_base64]
          properties:
            kind: { type: string, const: file }
            name: { type: string, minLength: 1 }
            media_type: { type: string }
            content_base64:
              type: string
              format: byte
              description: 中身を base64 にしたもの。中身は 10 MiB まで
        - type: object
          required: [kind, name, uri]
          properties:
            kind: { type: string, const: link }
            name: { type: string, minLength: 1 }
            uri: { type: string, format: uri }
            sha256: { $ref: '#/components/schemas/Sha256' }
            media_type: { type: string }

    BranchName:
      type: string
      minLength: 1
      description: git のブランチの名前（refs/heads/ の後ろ）。main は使えない
    OperationInput:
      description: 差分から復元した操作。ファイルの変化と 1 対 1 に対応する（../../design/backend/README.md の「操作と差分」）。識別子は、差分のファイルに書かれたものである
      oneOf:
        - $ref: '#/components/schemas/StoryCreate'
        - $ref: '#/components/schemas/StoryInactivate'
        - $ref: '#/components/schemas/VerdictSubmit'
        - $ref: '#/components/schemas/NodeEdit'
      discriminator:
        propertyName: kind
        mapping:
          story.create: '#/components/schemas/StoryCreate'
          story.inactivate: '#/components/schemas/StoryInactivate'
          verdict.submit: '#/components/schemas/VerdictSubmit'
          node.edit: '#/components/schemas/NodeEdit'
    StoryCreate:
      type: object
      required: [kind, story_id, parent_hypothesis_id, title, summary, hypotheses]
      properties:
        kind: { type: string, const: story.create }
        story_id: { type: string, pattern: '^s-' }
        parent_hypothesis_id: { type: string, pattern: '^h-' }
        title: { $ref: '#/components/schemas/Title' }
        summary: { $ref: '#/components/schemas/Summary' }
        hypotheses:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, statement]
            properties:
              id: { type: string, pattern: '^h-' }
              statement: { $ref: '#/components/schemas/Statement' }
              background: { type: string }
    StoryInactivate:
      type: object
      required: [kind, story_id, reason]
      properties:
        kind: { type: string, const: story.inactivate }
        story_id: { type: string, pattern: '^s-' }
        reason: { type: string, minLength: 1 }
    VerdictSubmit:
      type: object
      required: [kind, verdict_id, hypothesis_id, value, report_body]
      properties:
        kind: { type: string, const: verdict.submit }
        verdict_id: { type: string, pattern: '^v-' }
        hypothesis_id: { type: string, pattern: '^h-' }
        value: { type: boolean }
        report_body: { type: string, minLength: 1 }
        supersedes:
          type: array
          description: 差し替える、同じ仮説の有効な検証結果の識別子。まとめて差し替えられる
          items: { type: string, pattern: '^v-' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
    NodeEdit:
      type: object
      required: [kind, hypothesis_id, append_background]
      properties:
        kind: { type: string, const: node.edit }
        hypothesis_id: { type: string, pattern: '^h-' }
        append_background:
          type: string
          minLength: 1
          description: 背景情報の末尾に加える文章
    Operation:
      allOf:
        - $ref: '#/components/schemas/OperationInput'
        - type: object
          required: [position]
          properties:
            position: { type: integer }

    ApplyRequestState:
      type: string
      enum: [open, merged, closed]
    ApplyRequest:
      type: object
      required: [id, state, branch, target, head_commit, head_commits, operations, reviews, merge_failures, awaiting, warnings]
      properties:
        id: { type: string, pattern: '^apr_' }
        kind:
          type: string
          enum: [change, repair.revert, repair.accept]
          description: 直すための apply request の種類（../../design/backend/broken.md）。ふつうは change
        branch:
          $ref: '#/components/schemas/BranchName'
          description: apply request を作ったときのブランチ
        target:
          type: string
          description: >-
            向き先（pull request の base のブランチ）。Logiforge が作るものは main。
            main でなければ、Logiforge は検査も反映もしない。operations は空で、作業の一覧に出ない（../../design/backend/apply-request.md の「向き先」）
        state: { $ref: '#/components/schemas/ApplyRequestState' }
        head_commit:
          $ref: '#/components/schemas/Commit'
          description: ブランチの今の先頭のコミット。レビューと反映は、このコミットを SHA で指す
        head_commits:
          type: array
          description: ブランチに push された先頭のコミットの一覧（古い順）。worker が見つけた時刻と、書いたセッションを持つ（../../design/backend/apply-request.md の「先頭のコミット」）
          items:
            type: object
            required: [commit, base_commit, seen_at, author_session_id]
            properties:
              commit:
                $ref: '#/components/schemas/Commit'
              base_commit:
                type: string
                description: そのコミットと main の分かれた点。差分は、ここからの差分である。worker がまだ取り込んでいなければ空
              seen_at:
                type: [string, 'null']
                format: date-time
                description: worker が、そのコミットをブランチの先頭として見つけた時刻（push のおおよその時刻）。worker がまだ取り込んでいなければ null
              author_session_id:
                type: [string, 'null']
                description: そのコミットを書いたセッション。コミットの trailer の自己申告で、なければ null（../../design/files/revisions.md）
        description: { type: string }
        operations:
          type: array
          items: { $ref: '#/components/schemas/Operation' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        merge_failures:
          type: array
          items: { $ref: '#/components/schemas/MergeFailure' }
        awaiting:
          type: [string, 'null']
          enum: [review, fix, null]
          description: open のとき、レビュー待ち（review）か修正待ち（fix）か。向き先（target）が main でない apply request では null
        closed_reason: { type: [string, 'null'] }
        closed_by_session_id: { type: [string, 'null'] }
        warnings:
          type: array
          description: 警告。例：reviewer の主体が、pull request を作った主体と同じだった。向き先が main でないので、approve しても Logiforge は反映しない（../../design/backend/merge.md）
          items: { type: string }
        merged_commit:
          type: [string, 'null']
          description: 反映した main のコミット。反映されていなければ null
    ReviewKind:
      type: string
      enum: [approve, request_changes, comment]
    Review:
      type: object
      required: [id, kind, commit, reviewer_session_id, valid]
      properties:
        id: { type: string, pattern: '^rev_' }
        kind: { $ref: '#/components/schemas/ReviewKind' }
        commit:
          $ref: '#/components/schemas/Commit'
          description: レビューした先頭のコミット
        body: { type: string }
        reviewer_session_id: { type: string }
        prompt_revision:
          type: string
          description: 使ったプロンプトのリビジョン。木のコミットではない
        valid:
          type: boolean
          description: ブランチの今の先頭のコミットに対するレビューなら真
        reviewer:
          type: string
          description: レビューを書いた主体（GitForge の利用者の名前）。議論で、だれが書いたかを示すのに使う
        created_at:
          type: [string, 'null']
          format: date-time
          description: レビューを書いた時刻（GitForge のコメントの時刻）。読めなければ null。reviews は、この順に並ぶ
    MergeFailure:
      type: object
      required: [commit, reason, detail]
      properties:
        commit:
          $ref: '#/components/schemas/Commit'
          description: 反映しようとした先頭のコミット
        reason:
          type: string
          enum: [stale_target, invariant_violation, conflict, snapshot_pending, repository_broken, merge_forbidden]
          description: conflict は git の衝突。snapshot_pending は、今の main のスナップショットがまだなく、確かめられなかったこと。repository_broken は、壊れた repository に、直すための apply request でないものを反映しようとしたこと。merge_forbidden は、approve した reviewer に、GitForge で merge する権限がなく、GitForge が merge を断ったこと
        detail: { type: string }
    ReviewMaterial:
      type: object
      description: 材料に含めるものは ../../docs/apply-request/review.md に従う
      required: [apply_request_id, commit, operations, targets, ancestors, siblings, citations]
      properties:
        apply_request_id: { type: string, pattern: '^apr_' }
        commit: { $ref: '#/components/schemas/Commit' }
        repair:
          type: object
          description: 直すための apply request のときだけ。最後に正しかった時点から今の main までの、ファイルの変化（../../design/backend/broken.md）
          required: [kind, last_good_commit, main_commit, changes]
          properties:
            kind: { type: string, enum: [repair.revert, repair.accept] }
            last_good_commit: { type: string }
            main_commit: { type: string }
            changes:
              type: array
              items:
                type: object
                required: [path, status]
                properties:
                  path: { type: string }
                  status: { type: string, enum: [added, modified, deleted] }
                  before: { type: string, description: 前の中身。artifact と、前になかったファイルでは、ない }
                  after: { type: string, description: 今の中身。artifact と、消えたファイルでは、ない }
        operations:
          type: array
          description: 差分そのもの
          items: { $ref: '#/components/schemas/Operation' }
        targets:
          type: array
          description: 操作の対象ノードの、現在の状態と値
          items: { $ref: '#/components/schemas/Node' }
        ancestors:
          type: array
          description: 対象ノードの親仮説から根までの仮説（主文を含む）
          items: { $ref: '#/components/schemas/Hypothesis' }
        siblings:
          type: array
          description: 兄弟ストーリー（タイトル、概要、値）
          items: { $ref: '#/components/schemas/Story' }
        citations:
          type: array
          description: 引用している部分木（引用したコミットのもの）と artifact
          items:
            type: object
            required: [citation]
            properties:
              citation: { $ref: '#/components/schemas/Citation' }
              nodes:
                type: array
                items: { $ref: '#/components/schemas/Node' }
              artifact: { $ref: '#/components/schemas/Artifact' }

    WorkKind:
      type: string
      enum: [repair_repository, undecided_leaf, needs_reconsideration, review_waiting, fix_waiting, human_request_answered, citation_changed]
    WorkItem:
      type: object
      required: [kind, subject_id]
      description: |
        各種類の定義は ../../docs/work/README.md に従う。
        human_request_answered は、回答の artifact を引用した apply request が open になるか反映されたとき、
        または回答のあとに対象ノードについての apply request が反映されたときに、作業から外れる。
      properties:
        kind: { $ref: '#/components/schemas/WorkKind' }
        subject_id:
          type: string
          description: |
            作業の対象の識別子。
            undecided_leaf と needs_reconsideration では仮説、review_waiting と fix_waiting では apply request、
            human_request_answered では人への依頼、citation_changed では引用している検証結果（v-…）の識別子である。
        node_id:
          $ref: '#/components/schemas/NodeId'
          description: 作業の対象のノード。citation_changed では、検証結果を持つ仮説である。repair_repository では、ない（subject_id は、壊れた最初のコミット）
    Completion:
      type: object
      required: [commit, root_value, decided, remaining_work, done]
      properties:
        commit: { $ref: '#/components/schemas/Commit' }
        root_value: { $ref: '#/components/schemas/TruthValue' }
        decided:
          type: boolean
          description: 根の値が true か false
        remaining_work:
          type: integer
          description: 根拠部分木で着手できる作業の件数。数え方は ../../docs/work/README.md に従う
        done:
          type: boolean
          description: decided が真で、remaining_work が 0

    HumanRequestKind:
      type: string
      enum: [pvr, decision]
    HumanRequestState:
      type: string
      enum: [open, answered]
    HumanRequest:
      type: object
      required: [id, node_id, kind, body, state]
      description: 決まりは ../../docs/human-requests/README.md に従う
      properties:
        id: { type: string, pattern: '^hrq_' }
        node_id: { $ref: '#/components/schemas/NodeId' }
        kind: { $ref: '#/components/schemas/HumanRequestKind' }
        body: { type: string }
        state: { $ref: '#/components/schemas/HumanRequestState' }
        answer:
          oneOf:
            - type: 'null'
            - type: object
              required: [body, attachments, answered_at]
              properties:
                body: { type: string }
                attachments:
                  type: array
                  description: 添付。file のものは、getAnswerAttachment で読む。引用するときは、その URL の link にする（../../design/files/artifacts.md）
                  items: { $ref: '#/components/schemas/Artifact' }
                answered_at: { type: string, format: date-time }

    NodeHistoryEntry:
      type: object
      required: [commit, committed_at, apply_request_id, session_ids, reflected]
      description: main のコミットの trailer から作る（design/files/revisions.md）
      properties:
        commit: { $ref: '#/components/schemas/Commit' }
        committed_at: { type: string, format: date-time }
        apply_request_id:
          type: [string, 'null']
          description: 反映した apply request。最初のコミットと、反映によらないコミットでは null
        session_ids:
          type: array
          items: { type: string }
        reflected:
          type: boolean
          description: 反映の記録（Logiforge-Apply-Request:）があるか。false なら、反映の手順によらない変更である（最初のコミットを除く）
    NodeHistoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NodeHistoryEntry' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
