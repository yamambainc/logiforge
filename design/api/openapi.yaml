openapi: 3.1.0
info:
  title: Logiforge API
  version: 0.1.0
  description: |
    Logiforge のバックエンドの API。
    全体に共通する決まり（主体と認証、セッション ID、リビジョン、エラー、ページング）は design/api/README.md に書く。
    要件は docs/ が正本である。
    主文・タイトル・概要の文字数の上限と数え方は、https://github.com/yamambainc/logiforge/blob/main/docs/tree/README.md に従う。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /v1
    description: forge を置いたホストからの相対パス
security:
  - bearerAuth: []
tags:
  - name: project
    description: project の作成と参照
  - name: tree
    description: 木の参照
  - name: apply-request
    description: apply request と論理レビュー
  - name: work
    description: 着手できる作業と、作業の終わりの判定
  - name: evidence
    description: blob、artifact、検証結果、レポート
  - name: human-request
    description: 人への依頼（PVR と判断の依頼）
  - name: history
    description: 履歴とエクスポート
  - name: webhook
    description: webhook の登録

paths:
  /projects:
    get:
      tags: [project]
      operationId: listProjects
      summary: project の一覧
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: project の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [project]
      operationId: createProject
      summary: project を作る（user だけ。根の仮説の主文を一緒に受け取る）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, statement]
              properties:
                name: { $ref: '#/components/schemas/ProjectNameValue' }
                statement: { $ref: '#/components/schemas/Statement' }
                background: { type: string }
      responses:
        '201':
          description: 作った project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [project]
      operationId: getProject
      summary: project
      responses:
        '200':
          description: project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/tree:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [tree]
      operationId: getTree
      summary: 木の概要
      parameters:
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: 木の概要。根がまだなければ 404
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tree' }
        '4XX': { $ref: '#/components/responses/Problem' }
  /projects/{project}/tree/nodes:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [tree]
      operationId: listNodes
      summary: 木または部分木のノード
      description: |
        `root` を指定すると、そのノードを根とする部分木だけを返す。
        `revision` を指定すると、そのリビジョンの木を返す。
      parameters:
        - $ref: '#/components/parameters/Revision'
        - name: root
          in: query
          description: 部分木の根にするノード
          schema: { $ref: '#/components/schemas/NodeId' }
        - name: depth
          in: query
          description: 部分木の根から何段までを返すか。指定しなければすべて
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: ノードの一覧
          content:
            application/json:
              schema:
                type: object
                required: [revision, nodes]
                properties:
                  revision: { $ref: '#/components/schemas/Revision' }
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/Node' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/tree/completion:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [work]
      operationId: getCompletion
      summary: 作業の終わりの判定
      responses:
        '200':
          description: 判定の結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Completion' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/tree/export:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [history]
      operationId: exportTree
      summary: 木を JSON か Markdown で書き出す
      parameters:
        - $ref: '#/components/parameters/Revision'
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [json, markdown] }
      responses:
        '200':
          description: 書き出した木
          content:
            application/json:
              schema: { type: object }
            text/markdown:
              schema: { type: string }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [tree]
      operationId: getNode
      summary: ノードの詳細
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: ノードの詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/nodes/{nodeId}/history:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [history]
      operationId: getNodeHistory
      summary: ノードの履歴
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: そのノードに関わるイベント
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/apply-requests:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [apply-request]
      operationId: listApplyRequests
      summary: apply request の一覧
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ApplyRequestState' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: apply request の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApplyRequest' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [apply-request]
      operationId: createApplyRequest
      summary: apply request を作る（client だけ）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                description:
                  type: string
                  description: 説明欄。レビューの材料には含めない
                operations:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/OperationInput' }
      responses:
        '201':
          description: 作った apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/apply-requests/{applyRequestId}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [apply-request]
      operationId: getApplyRequest
      summary: apply request の詳細（差分、レビュー、反映の失敗）
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      responses:
        '200':
          description: apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [apply-request]
      operationId: updateApplyRequest
      summary: apply request を更新する（client なら、どのセッションからでもよい）
      description: |
        `operations` を指定すると、操作をすべて置き換えた新しい版を作る。
        新しい版には、更新したセッションを `author_session_id` として記録する。
        それまでの approve の扱いは、[反映の条件](https://github.com/yamambainc/logiforge/blob/main/docs/apply-request/review.md) に従う。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                operations:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/OperationInput' }
      responses:
        '200':
          description: 更新した apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/apply-requests/{applyRequestId}/reviews:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    post:
      tags: [apply-request]
      operationId: reviewApplyRequest
      summary: レビューを付ける（client だけ。差分を書いたどのセッションとも別のセッション）
      description: |
        `approve` で反映の条件を満たしたら、この要求の中で反映する。
        反映に失敗しても、エラーにはしない。応答の `apply_request.merge_failures` に理由が入る。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, version]
              properties:
                kind: { $ref: '#/components/schemas/ReviewKind' }
                version:
                  type: integer
                  description: レビューした差分の版。今の版と違えば受け付けない
                body: { type: string }
                prompt_revision:
                  type: string
                  description: 使ったプロンプトのリビジョン。approve では必須
      responses:
        '201':
          description: 付けたレビューと、その後の apply request
          content:
            application/json:
              schema:
                type: object
                required: [review, apply_request]
                properties:
                  review: { $ref: '#/components/schemas/Review' }
                  apply_request: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/apply-requests/{applyRequestId}/close:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    post:
      tags: [apply-request]
      operationId: closeApplyRequest
      summary: apply request を close する（却下または取り下げ）
      description: |
        差分を書いたいずれかのセッションからなら、取り下げとして扱う。
        それ以外のセッションからなら、却下として扱う。
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: close した apply request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/apply-requests/{applyRequestId}/review-material:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [apply-request]
      operationId: getReviewMaterial
      summary: レビューの材料
      parameters:
        - $ref: '#/components/parameters/ApplyRequestId'
      responses:
        '200':
          description: 今の版の差分に対するレビューの材料。説明欄は含めない
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewMaterial' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/work:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [work]
      operationId: listWork
      summary: 着手できる作業
      parameters:
        - name: subtree
          in: query
          description: この部分木の中の作業だけを返す
          schema: { $ref: '#/components/schemas/NodeId' }
        - name: kind
          in: query
          description: 返す作業の種類。指定しなければすべて
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkKind' }
          style: form
          explode: false
        - name: include_claimed
          in: query
          description: 真なら、open の apply request が対象にしているノードの作業も返す
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 着手できる作業
          content:
            application/json:
              schema:
                type: object
                required: [revision, counts, items, next_cursor]
                properties:
                  revision: { $ref: '#/components/schemas/Revision' }
                  counts:
                    type: object
                    description: 種類ごとの件数（ページに関わらず全体）
                    additionalProperties: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkItem' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/blobs:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    post:
      tags: [evidence]
      operationId: uploadBlob
      summary: ファイルの中身を置く
      description: 同じ中身がすでにあれば、置かずに同じ結果を返す
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 置いた blob
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blob' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/blobs/{sha256}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [evidence]
      operationId: getBlob
      summary: ファイルの中身を読む
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Sha256' }
      responses:
        '200':
          description: 中身
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    post:
      tags: [evidence]
      operationId: createArtifact
      summary: artifact を登録する
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/ArtifactKind' }
                sha256: { $ref: '#/components/schemas/Sha256' }
                uri: { type: string, format: uri }
                media_type: { type: string }
      responses:
        '201':
          description: 登録した artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [evidence]
      operationId: getArtifact
      summary: artifact
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string, pattern: '^art_' }
      responses:
        '200':
          description: artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/verdicts/{verdictId}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [evidence]
      operationId: getVerdict
      summary: 検証結果とレポート
      parameters:
        - name: verdictId
          in: path
          required: true
          schema: { type: string, pattern: '^v-' }
      responses:
        '200':
          description: 検証結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verdict' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/human-requests:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [human-request]
      operationId: listHumanRequests
      summary: 人への依頼の一覧
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/HumanRequestKind' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/HumanRequestState' }
        - name: node_id
          in: query
          schema: { $ref: '#/components/schemas/NodeId' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 人への依頼の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HumanRequest' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [human-request]
      operationId: createHumanRequest
      summary: 人への依頼を起票する（client だけ）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, kind, body]
              properties:
                node_id: { $ref: '#/components/schemas/NodeId' }
                kind: { $ref: '#/components/schemas/HumanRequestKind' }
                body:
                  type: string
                  minLength: 1
                  description: 検証手順、または問い
      responses:
        '201':
          description: 起票した人への依頼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/human-requests/{humanRequestId}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [human-request]
      operationId: getHumanRequest
      summary: 人への依頼と、その回答
      parameters:
        - $ref: '#/components/parameters/HumanRequestId'
      responses:
        '200':
          description: 人への依頼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/human-requests/{humanRequestId}/answer:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    post:
      tags: [human-request]
      operationId: answerHumanRequest
      summary: 人への依頼に回答する（user だけ。1 回だけ）
      parameters:
        - $ref: '#/components/parameters/HumanRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
                attachment_artifact_ids:
                  type: array
                  items: { type: string, pattern: '^art_' }
      responses:
        '201':
          description: 回答した人への依頼。回答は artifact としても登録される
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanRequest' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/events:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [history]
      operationId: listEvents
      summary: イベントの一覧
      parameters:
        - name: after
          in: query
          description: この seq より後のイベントだけを返す
          schema: { type: integer, minimum: 0 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: イベントの一覧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/webhooks:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      tags: [webhook]
      operationId: listWebhooks
      summary: 登録した webhook
      responses:
        '200':
          description: webhook の一覧
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [webhook]
      operationId: createWebhook
      summary: webhook を登録する（client だけ）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/WebhookEventType' }
      responses:
        '201':
          description: 登録した webhook。秘密鍵はこの応答でだけ返す
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Webhook'
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        '4XX': { $ref: '#/components/responses/Problem' }

  /projects/{project}/webhooks/{webhookId}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    delete:
      tags: [webhook]
      operationId: deleteWebhook
      summary: webhook の登録を消す
      parameters:
        - name: webhookId
          in: path
          required: true
          schema: { type: string, pattern: '^whk_' }
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: 消した
        '4XX': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 主体（user または client）を示すトークン

  parameters:
    ProjectName:
      name: project
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectNameValue' }
    NodeIdPath:
      name: nodeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NodeId' }
    ApplyRequestId:
      name: applyRequestId
      in: path
      required: true
      schema: { type: string, pattern: '^apr_' }
    HumanRequestId:
      name: humanRequestId
      in: path
      required: true
      schema: { type: string, pattern: '^hrq_' }
    Revision:
      name: revision
      in: query
      description: 読むリビジョン。指定しなければ最新
      schema: { $ref: '#/components/schemas/Revision' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    SessionId:
      name: Logiforge-Session-Id
      in: header
      required: true
      description: client のセッション ID
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 128 }

  responses:
    Problem:
      description: エラー
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ProjectNameValue:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      description: project の名前。forge の中で一意
    Project:
      type: object
      required: [name, provider, root_hypothesis_id]
      properties:
        name: { $ref: '#/components/schemas/ProjectNameValue' }
        provider:
          type: string
          enum: [github, native]
        root_hypothesis_id: { type: string, pattern: '^h-' }
        root_value: { $ref: '#/components/schemas/TruthValue' }
    Revision:
      type: string
      pattern: '^[0-9a-f]{40}$'
      description: main のコミットの SHA（https://github.com/yamambainc/logiforge/blob/main/design/files/revisions.md）
    NextCursor:
      type: [string, 'null']
    NodeId:
      type: string
      pattern: '^[hs]-'
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    TruthValue:
      type: [boolean, 'null']
      description: true、false、null（未決）
    Statement:
      type: string
      description: 主文。文字数は info.description の決まりに従う
    Title:
      type: string
      description: タイトル。文字数は info.description の決まりに従う
    Summary:
      type: string
      description: 概要。文字数は info.description の決まりに従う

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [validation_failed, unauthenticated, forbidden, session_required, not_found, same_session, not_open, project_exists]

    Tree:
      type: object
      required: [root_hypothesis_id, root_value, revision, warnings]
      properties:
        root_hypothesis_id: { type: string, pattern: '^h-' }
        root_value: { $ref: '#/components/schemas/TruthValue' }
        revision: { $ref: '#/components/schemas/Revision' }
        warnings:
          type: array
          description: main に、反映の手順によらないコミットがあるときの警告（https://github.com/yamambainc/logiforge/blob/main/design/providers/github.md）
          items: { type: string }

    Node:
      oneOf:
        - $ref: '#/components/schemas/Hypothesis'
        - $ref: '#/components/schemas/Story'
      discriminator:
        propertyName: node_type
        mapping:
          hypothesis: '#/components/schemas/Hypothesis'
          story: '#/components/schemas/Story'
    Hypothesis:
      type: object
      required: [node_type, id, parent_story_id, statement, value, leaf, needs_reconsideration, inactive, open_apply_request_ids, open_human_request_ids]
      properties:
        node_type: { type: string, const: hypothesis }
        id: { type: string, pattern: '^h-' }
        parent_story_id:
          type: [string, 'null']
          description: 根のときだけ null
        statement: { $ref: '#/components/schemas/Statement' }
        background: { type: string }
        value: { $ref: '#/components/schemas/TruthValue' }
        valid_verdict_id: { type: [string, 'null'] }
        leaf:
          type: boolean
          description: 葉かどうか（https://github.com/yamambainc/logiforge/blob/main/docs/tree/README.md）
        needs_reconsideration:
          type: boolean
          description: 要再検討かどうか（https://github.com/yamambainc/logiforge/blob/main/docs/tree/propagation.md）
        inactive:
          type: boolean
          description: inactive かどうか（https://github.com/yamambainc/logiforge/blob/main/docs/tree/inactive.md）
        open_apply_request_ids:
          type: array
          description: このノードを対象にした open の apply request
          items: { type: string }
        open_human_request_ids:
          type: array
          description: このノードを対象にした open の人への依頼
          items: { type: string }
    Story:
      type: object
      required: [node_type, id, parent_hypothesis_id, title, summary, state, value, inactive, open_apply_request_ids, open_human_request_ids]
      properties:
        node_type: { type: string, const: story }
        id: { type: string, pattern: '^s-' }
        parent_hypothesis_id: { type: string, pattern: '^h-' }
        title: { $ref: '#/components/schemas/Title' }
        summary: { $ref: '#/components/schemas/Summary' }
        state: { type: string, enum: [active, inactive] }
        reason:
          type: [string, 'null']
          description: inactive にした理由
        value: { $ref: '#/components/schemas/TruthValue' }
        inactive:
          type: boolean
          description: inactive かどうか（https://github.com/yamambainc/logiforge/blob/main/docs/tree/inactive.md）
        open_apply_request_ids:
          type: array
          items: { type: string }
        open_human_request_ids:
          type: array
          items: { type: string }
    NodeDetail:
      type: object
      required: [revision, node, children, cited_by]
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        node: { $ref: '#/components/schemas/Node' }
        children:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        verdict:
          oneOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        cited_by:
          type: array
          description: このノードの部分木を引用している検証結果
          items: { type: string, pattern: '^v-' }

    Verdict:
      type: object
      required: [id, hypothesis_id, value, report_body, artifact_ids, citations, submitted_revision]
      properties:
        id: { type: string, pattern: '^v-' }
        hypothesis_id: { type: string, pattern: '^h-' }
        value: { type: boolean }
        report_body: { type: string }
        artifact_ids:
          type: array
          items: { type: string, pattern: '^art_' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        apply_request_id: { type: string, pattern: '^apr_' }
        submitted_revision: { $ref: '#/components/schemas/Revision' }
        superseded_revision:
          type: [string, 'null']
          description: 差し替えられたリビジョン。有効な間は null
    Citation:
      oneOf:
        - type: object
          required: [target_kind, artifact_id]
          properties:
            target_kind: { type: string, const: artifact }
            artifact_id: { type: string, pattern: '^art_' }
        - type: object
          required: [target_kind, node_id, revision]
          properties:
            target_kind: { type: string, const: subtree }
            node_id: { $ref: '#/components/schemas/NodeId' }
            revision: { $ref: '#/components/schemas/Revision' }
    Artifact:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, pattern: '^art_' }
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        sha256: { $ref: '#/components/schemas/Sha256' }
        uri: { type: string }
        media_type: { type: string }
    ArtifactKind:
      type: string
      enum: [file, link, reference, program, output, human_entry]
    Blob:
      type: object
      required: [sha256, size]
      properties:
        sha256: { $ref: '#/components/schemas/Sha256' }
        size: { type: integer }

    OperationInput:
      oneOf:
        - $ref: '#/components/schemas/StoryCreate'
        - $ref: '#/components/schemas/StoryInactivate'
        - $ref: '#/components/schemas/VerdictSubmit'
        - $ref: '#/components/schemas/NodeEdit'
      discriminator:
        propertyName: kind
        mapping:
          story.create: '#/components/schemas/StoryCreate'
          story.inactivate: '#/components/schemas/StoryInactivate'
          verdict.submit: '#/components/schemas/VerdictSubmit'
          node.edit: '#/components/schemas/NodeEdit'
    StoryCreate:
      type: object
      required: [kind, parent_hypothesis_id, title, summary, hypotheses]
      properties:
        kind: { type: string, const: story.create }
        parent_hypothesis_id:
          type: string
          description: 親仮説の識別子か、同じ apply request で作る仮説の ref
        title: { $ref: '#/components/schemas/Title' }
        summary: { $ref: '#/components/schemas/Summary' }
        hypotheses:
          type: array
          minItems: 1
          items:
            type: object
            required: [statement]
            properties:
              ref:
                type: string
                description: 同じ apply request のほかの操作から、この仮説を指す名前
              statement: { $ref: '#/components/schemas/Statement' }
              background: { type: string }
    StoryInactivate:
      type: object
      required: [kind, story_id, reason]
      properties:
        kind: { type: string, const: story.inactivate }
        story_id: { type: string, pattern: '^s-' }
        reason: { type: string, minLength: 1 }
    VerdictSubmit:
      type: object
      required: [kind, hypothesis, value, report_body]
      properties:
        kind: { type: string, const: verdict.submit }
        hypothesis:
          type: string
          description: 仮説の識別子か、同じ apply request で作る仮説の ref
        value: { type: boolean }
        report_body: { type: string, minLength: 1 }
        artifact_ids:
          type: array
          items: { type: string, pattern: '^art_' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
    NodeEdit:
      type: object
      required: [kind, hypothesis_id, append_background]
      properties:
        kind: { type: string, const: node.edit }
        hypothesis_id: { type: string, pattern: '^h-' }
        append_background:
          type: string
          minLength: 1
          description: 背景情報の末尾に加える文章
    Operation:
      allOf:
        - $ref: '#/components/schemas/OperationInput'
        - type: object
          required: [position]
          properties:
            position: { type: integer }

    ApplyRequestState:
      type: string
      enum: [open, merged, closed]
    ApplyRequest:
      type: object
      required: [id, state, version, versions, operations, reviews, merge_failures, awaiting]
      properties:
        id: { type: string, pattern: '^apr_' }
        state: { $ref: '#/components/schemas/ApplyRequestState' }
        version:
          type: integer
          description: 今の差分の版
        versions:
          type: array
          description: 版ごとの、差分を書いたセッション
          items:
            type: object
            required: [version, head_commit, author_session_id]
            properties:
              version: { type: integer }
              head_commit: { type: string, pattern: '^[0-9a-f]{40}$' }
              author_session_id: { type: string }
        description: { type: string }
        operations:
          type: array
          items: { $ref: '#/components/schemas/Operation' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        merge_failures:
          type: array
          items: { $ref: '#/components/schemas/MergeFailure' }
        awaiting:
          type: [string, 'null']
          enum: [review, fix, null]
          description: open のとき、レビュー待ち（review）か修正待ち（fix）か
        closed_reason: { type: [string, 'null'] }
        closed_by_session_id: { type: [string, 'null'] }
        merged_revision: { type: [string, 'null'] }
    ReviewKind:
      type: string
      enum: [approve, request_changes, comment]
    Review:
      type: object
      required: [id, kind, version, reviewer_session_id, valid]
      properties:
        id: { type: string, pattern: '^rev_' }
        kind: { $ref: '#/components/schemas/ReviewKind' }
        version: { type: integer }
        body: { type: string }
        reviewer_session_id: { type: string }
        prompt_revision: { type: string }
        valid:
          type: boolean
          description: 今の版に対するレビューなら真
    MergeFailure:
      type: object
      required: [version, reason, detail]
      properties:
        version: { type: integer }
        reason: { type: string, enum: [stale_target, invariant_violation] }
        detail: { type: string }
    ReviewMaterial:
      type: object
      description: 材料に含めるものは https://github.com/yamambainc/logiforge/blob/main/docs/apply-request/review.md に従う
      required: [apply_request_id, version, revision, operations, targets, ancestors, siblings, citations]
      properties:
        apply_request_id: { type: string, pattern: '^apr_' }
        version: { type: integer }
        revision: { $ref: '#/components/schemas/Revision' }
        operations:
          type: array
          description: 差分そのもの
          items: { $ref: '#/components/schemas/Operation' }
        targets:
          type: array
          description: 操作の対象ノードの、現在の状態と値
          items: { $ref: '#/components/schemas/Node' }
        ancestors:
          type: array
          description: 対象ノードの親仮説から根までの仮説（主文を含む）
          items: { $ref: '#/components/schemas/Hypothesis' }
        siblings:
          type: array
          description: 兄弟ストーリー（タイトル、概要、値）
          items: { $ref: '#/components/schemas/Story' }
        citations:
          type: array
          description: 引用している部分木（固定したリビジョンのもの）と artifact
          items:
            type: object
            required: [citation]
            properties:
              citation: { $ref: '#/components/schemas/Citation' }
              nodes:
                type: array
                items: { $ref: '#/components/schemas/Node' }
              artifact: { $ref: '#/components/schemas/Artifact' }

    WorkKind:
      type: string
      enum: [undecided_leaf, needs_reconsideration, review_waiting, fix_waiting, human_request_answered, citation_changed]
    WorkItem:
      type: object
      required: [kind, subject_id]
      description: |
        各種類の定義は https://github.com/yamambainc/logiforge/blob/main/docs/work/README.md に従う。
        human_request_answered は、回答の artifact を引用した apply request が open になるか反映されたとき、
        または回答のあとに対象ノードについての apply request が反映されたときに、作業から外れる。
      properties:
        kind: { $ref: '#/components/schemas/WorkKind' }
        subject_id:
          type: string
          description: ノード、apply request、人への依頼、引用のいずれかの識別子
        node_id: { $ref: '#/components/schemas/NodeId' }
    Completion:
      type: object
      required: [revision, root_value, decided, remaining_work, done]
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        root_value: { $ref: '#/components/schemas/TruthValue' }
        decided:
          type: boolean
          description: 根の値が true か false
        remaining_work:
          type: integer
          description: 根拠部分木で着手できる作業の件数。数え方は https://github.com/yamambainc/logiforge/blob/main/docs/work/README.md に従う
        done:
          type: boolean
          description: decided が真で、remaining_work が 0

    HumanRequestKind:
      type: string
      enum: [pvr, decision]
    HumanRequestState:
      type: string
      enum: [open, answered]
    HumanRequest:
      type: object
      required: [id, node_id, kind, body, state]
      description: 決まりは https://github.com/yamambainc/logiforge/blob/main/docs/human-requests/README.md に従う
      properties:
        id: { type: string, pattern: '^hrq_' }
        node_id: { $ref: '#/components/schemas/NodeId' }
        kind: { $ref: '#/components/schemas/HumanRequestKind' }
        body: { type: string }
        state: { $ref: '#/components/schemas/HumanRequestState' }
        answer:
          oneOf:
            - type: 'null'
            - type: object
              required: [body, artifact_id, answered_at]
              properties:
                body: { type: string }
                artifact_id:
                  type: string
                  pattern: '^art_'
                  description: 回答を登録した artifact（human_entry）
                attachment_artifact_ids:
                  type: array
                  items: { type: string, pattern: '^art_' }
                answered_at: { type: string, format: date-time }

    Event:
      type: object
      required: [seq, kind, occurred_at]
      properties:
        seq: { type: integer, minimum: 1 }
        kind: { type: string }
        subject_id: { type: string }
        actor_session_id: { type: [string, 'null'] }
        apply_request_id: { type: [string, 'null'] }
        payload: { type: object }
        occurred_at: { type: string, format: date-time }
    EventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    WebhookEventType:
      type: string
      description: 種類と送る条件は design/api/webhook.md に書く
      enum: [apply_request.changed, human_request.changed, citation.changed]
    Webhook:
      type: object
      required: [id, url, events]
      properties:
        id: { type: string, pattern: '^whk_' }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
