name: release

# タグ（v0.1.0 など）を push すると、GoReleaser でバイナリを作り、GitHub Releases に置く（.goreleaser.yaml、issue #27）。
# このジョブは、repository に書く権限（contents: write）を持つ。そのため、外の action はコミットの SHA で指し、GoReleaser の本体も版を決める。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      # release-notes/<タグ>.md があれば、リリースの本文の先頭に置く（互換のない変更など。docs/development/release.md）。
      - id: notes
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "args=--release-header $f" >> "$GITHUB_OUTPUT"; fi
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
