name: go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...

  forgejo:
    # 動く Forgejo での結合テスト（internal/adapters/forgejo）。
    runs-on: ubuntu-latest
    env:
      FORGEJO_VERSION: 17.0.1
      FORGEJO_SHA256: 51a8cdf4a1252e79f4b3855d7a7891af6c6635105420768c460e2f0690385d6f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Forgejo を取ってくる
        run: |
          curl -sSfL -o "$RUNNER_TEMP/forgejo" "https://codeberg.org/forgejo/forgejo/releases/download/v${FORGEJO_VERSION}/forgejo-${FORGEJO_VERSION}-linux-amd64"
          echo "${FORGEJO_SHA256}  $RUNNER_TEMP/forgejo" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/forgejo"
      - name: Forgejo を起動する
        run: scripts/forgejo-test.sh "$RUNNER_TEMP/forgejo" 3999 >> "$GITHUB_ENV"
      - run: go test -race -count=1 -v -run TestForgejo ./internal/adapters/forgejo/
