name: go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...

  forgejo:
    # 動く Forgejo での結合テスト（internal/adapters/forgejo）。
    runs-on: ubuntu-latest
    env:
      FORGEJO_VERSION: 17.0.1
      FORGEJO_SHA256: 51a8cdf4a1252e79f4b3855d7a7891af6c6635105420768c460e2f0690385d6f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Forgejo のバイナリのキャッシュ
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/forgejo
          key: forgejo-${{ env.FORGEJO_VERSION }}-${{ env.FORGEJO_SHA256 }}
      - name: Forgejo を取ってくる
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/forgejo
          curl -sSfL -o ~/.cache/forgejo/forgejo "https://codeberg.org/forgejo/forgejo/releases/download/v${FORGEJO_VERSION}/forgejo-${FORGEJO_VERSION}-linux-amd64"
      - name: Forgejo のバイナリを確かめる
        run: |
          echo "${FORGEJO_SHA256}  $HOME/.cache/forgejo/forgejo" | sha256sum -c -
          chmod +x ~/.cache/forgejo/forgejo
      - name: Forgejo を起動する
        run: scripts/forgejo-test.sh ~/.cache/forgejo/forgejo 3999 >> "$GITHUB_ENV"
      - run: go test -race -count=1 -v -run TestForgejo ./internal/adapters/forgejo/

  e2e:
    # 動く Forgejo と、logiforge の serve、worker、CLI をつないだ E2E（internal/e2e）。
    runs-on: ubuntu-latest
    env:
      FORGEJO_VERSION: 17.0.1
      FORGEJO_SHA256: 51a8cdf4a1252e79f4b3855d7a7891af6c6635105420768c460e2f0690385d6f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Forgejo のバイナリのキャッシュ
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/forgejo
          key: forgejo-${{ env.FORGEJO_VERSION }}-${{ env.FORGEJO_SHA256 }}
      - name: Forgejo を取ってくる
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/forgejo
          curl -sSfL -o ~/.cache/forgejo/forgejo "https://codeberg.org/forgejo/forgejo/releases/download/v${FORGEJO_VERSION}/forgejo-${FORGEJO_VERSION}-linux-amd64"
      - name: Forgejo のバイナリを確かめる
        run: |
          echo "${FORGEJO_SHA256}  $HOME/.cache/forgejo/forgejo" | sha256sum -c -
          chmod +x ~/.cache/forgejo/forgejo
      - name: Forgejo を起動する
        run: scripts/forgejo-test.sh ~/.cache/forgejo/forgejo 3999 >> "$GITHUB_ENV"
      - run: go test -count=1 -timeout 20m -v ./internal/e2e/
