name: go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...

  release-snapshot:
    # GoReleaser の設定（.goreleaser.yaml）を確かめ、linux/amd64 だけを、どこにも置かずにビルドする。
    # before の hook（WebUI のビルド）と、-ldflags -X で版とコミットが入ることを確かめる。リリースそのものはタグで動く（release.yml）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.2
          # release は、作る OS と CPU を絞れないので、build --single-target で linux/amd64 だけを作る（hook と -X は release と同じ）
          args: build --snapshot --clean --single-target
        env:
          GOOS: linux
          GOARCH: amd64
      - name: バイナリに、版とコミットと WebUI が入っている
        run: |
          bin=$(ls dist/logiforge_linux_amd64*/logiforge)
          "$bin" version
          test "$("$bin" version --json | jq -r .commit)" = "$(git rev-parse HEAD)"
          "$bin" version --json | jq -e '.version | test("snapshot")'
          grep -aq 'dist/assets/main-' "$bin"

  webui:
    # WebUI の型の検査、単体のテスト、ビルド。ビルドした出力にインラインの script と style がないことも確かめる（design/webui/security.md）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  forgejo:
    # 動く Forgejo での結合テスト（internal/adapters/forgejo）。
    runs-on: ubuntu-latest
    env:
      FORGEJO_VERSION: 17.0.1
      FORGEJO_SHA256: 51a8cdf4a1252e79f4b3855d7a7891af6c6635105420768c460e2f0690385d6f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Forgejo のバイナリのキャッシュ
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/forgejo
          key: forgejo-${{ env.FORGEJO_VERSION }}-${{ env.FORGEJO_SHA256 }}
      - name: Forgejo を取ってくる
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/forgejo
          curl -sSfL -o ~/.cache/forgejo/forgejo "https://codeberg.org/forgejo/forgejo/releases/download/v${FORGEJO_VERSION}/forgejo-${FORGEJO_VERSION}-linux-amd64"
      - name: Forgejo のバイナリを確かめる
        run: |
          echo "${FORGEJO_SHA256}  $HOME/.cache/forgejo/forgejo" | sha256sum -c -
          chmod +x ~/.cache/forgejo/forgejo
      - name: Forgejo を起動する
        run: scripts/forgejo-test.sh ~/.cache/forgejo/forgejo 3999 >> "$GITHUB_ENV"
      - run: go test -race -count=1 -v -run TestForgejo ./internal/adapters/forgejo/

  e2e:
    # 動く Forgejo と、logiforge の serve、worker、CLI をつないだ E2E（internal/e2e）。
    runs-on: ubuntu-latest
    env:
      FORGEJO_VERSION: 17.0.1
      FORGEJO_SHA256: 51a8cdf4a1252e79f4b3855d7a7891af6c6635105420768c460e2f0690385d6f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Forgejo のバイナリのキャッシュ
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/forgejo
          key: forgejo-${{ env.FORGEJO_VERSION }}-${{ env.FORGEJO_SHA256 }}
      - name: Forgejo を取ってくる
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/forgejo
          curl -sSfL -o ~/.cache/forgejo/forgejo "https://codeberg.org/forgejo/forgejo/releases/download/v${FORGEJO_VERSION}/forgejo-${FORGEJO_VERSION}-linux-amd64"
      - name: Forgejo のバイナリを確かめる
        run: |
          echo "${FORGEJO_SHA256}  $HOME/.cache/forgejo/forgejo" | sha256sum -c -
          chmod +x ~/.cache/forgejo/forgejo
      - name: Forgejo を起動する
        run: scripts/forgejo-test.sh ~/.cache/forgejo/forgejo 3999 >> "$GITHUB_ENV"
      # WebUI をビルドしてから、logiforge をビルドする（embed する）。ブラウザの E2E は、runner の Chrome で動かす。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: WebUI をビルドする
        working-directory: webui
        run: |
          npm ci
          npm run build
      - run: go test -count=1 -timeout 20m -v -run TestWebUISignIn ./internal/e2e/
        env:
          LOGIFORGE_E2E_CHROME: /usr/bin/google-chrome
          LOGIFORGE_E2E_OUT: ${{ runner.temp }}/e2e-webui
      - name: ブラウザの E2E のスクリーンショット
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webui
          path: ${{ runner.temp }}/e2e-webui
          if-no-files-found: ignore

  container:
    # イメージをビルドし、compose で Forgejo、worker、バックエンドを動かして、つながることを確かめる（design/deploy/README.md）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: イメージをビルドする
        # 版とコミットを、イメージの logiforge に入れる（Dockerfile の ARG）
        run: |
          export LOGIFORGE_VERSION=$(git describe --tags --always --dirty) LOGIFORGE_COMMIT=$(git rev-parse HEAD)
          echo "LOGIFORGE_COMMIT=$LOGIFORGE_COMMIT" >> "$GITHUB_ENV"
          docker compose build
      - name: compose で動かす
        run: |
          scripts/compose-setup.sh
          docker compose up -d --wait
      - name: イメージの logiforge に、版とコミットが入っている
        run: |
          docker compose exec -T backend logiforge version
          test "$(docker compose exec -T backend logiforge version --json | jq -r .commit)" = "$LOGIFORGE_COMMIT"
      - name: root で動いていない
        run: |
          test "$(docker compose exec -T backend id -u)" = 10001
          test "$(docker compose exec -T worker id -u)" = 10001
      - name: バックエンドのヘルスチェックと、repository の作成と読み
        run: |
          curl -fsS http://localhost:8080/healthz
          token=$(cat .compose/alice_token)
          # 作成は、worker が読む側に出すまで、上限つきで待ってから応答する。置き場の共有を確かめる。
          # worker が新しい repository を見回りに入れるのは、一覧を読み直したあと（既定 10 秒ごと）なので、出るまで待つ。
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"demo","statement":"問い"}' http://localhost:8080/v1/repositories
          for i in $(seq 30); do
            curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/v1/repositories/demo/tree && exit 0
            sleep 2
          done
          exit 1
      - name: 失敗したときのログ
        if: failure()
        run: docker compose logs
